services:
  backend:
    build:
      # THE BUILD CONTEXT IS THE REPO ROOT, not this directory, because this app
      # is a pnpm workspace member and its Dockerfile needs the root lockfile.
      # The two Python backends can use `build: .` precisely because they are
      # not workspace members; the difference is real and not an oversight.
      context: ../..
      dockerfile: apps/node-backend/Dockerfile
    ports:
      - "8003:8003"
    environment:
      # PASS THE MODEL KEY IN FROM THE HOST, FOR CI.
      #
      # The env_file below is the repo-root .env — present on a developer
      # machine, absent on a CI runner, and `required: false` makes that absence
      # silent. Both Python compose files carry this same block for the same
      # reason: a step that sets the key in its own env would otherwise find the
      # container never saw it.
      #
      # BARE NAMES, NOT `KEY=${KEY:-}`. A value in `environment:` OVERRIDES
      # env_file, so the default-empty form would blank out the key a developer
      # already has in .env — a CI fix that breaks local runs.
      - NVIDIA_API_KEY
      - OPENROUTER_API_KEY
      - ANTHROPIC_API_KEY
      - NVIDIA_MODEL
      - OPENROUTER_MODEL
    env_file:
      - path: ../../.env
        required: false
      - path: .env.local
        required: false
    extra_hosts:
      # THE TOOLS CALL BACK OUT TO THE HOST, AND ON LINUX THAT NAME DOES NOT
      # EXIST WITHOUT THIS. `COUNTER_URL` defaults to
      # http://host.docker.internal:3000/api/counter and both counter tools are
      # plain HTTP calls to it. Docker Desktop resolves the name for free, so a
      # developer on macOS never sees the gap; on a Linux CI runner it does not
      # resolve at all and the write silently goes nowhere. The symptom is not
      # an error — reads come from the runner and keep working, so a tool matrix
      # reports calls against a counter that never moved.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
