services:
  backend:
    build: .
    ports:
      - "8001:8001"
    env_file:
      # THE REPO-ROOT .env IS THE SINGLE SOURCE for secrets, read directly
      # rather than copied here. A duplicated secret is one you have to
      # remember to update twice, and the copy you forget is the one that
      # keeps silently working until it does not. Listed FIRST so a
      # backend-specific .env.local still overrides it when one exists.
      - path: ../../.env
        required: false
      - path: .env.local
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    profiles: [full]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../../:/monorepo
    command: sh -c "cd /monorepo && npm install -g pnpm && pnpm install --frozen-lockfile && cd apps/example && pnpm build && pnpm start"
    ports:
      - "3002:3000"
    environment:
      BACKEND_URL: http://backend:8001/api/chat/stream
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
