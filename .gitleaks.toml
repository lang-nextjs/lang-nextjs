# Gitleaks config — paths excluded from secret scanning because they
# contain build-time-generated keys (Next.js preview keys, etc.) that
# are not real secrets, OR are vendored test fixtures that mention
# example credentials in code samples.

title = "lang-nextjs gitleaks config"

[extend]
# Inherit Gitleaks' default rules (all the API key formats, AWS, GCP,
# Stripe, GitHub, etc.). Only override the allowlist.
useDefault = true

[allowlist]
description = "Exclude Next.js build artefacts and example credentials in docs/test fixtures."

# ── Ellipsis placeholder PEM blocks (vendored rung-5 upstream setup docs) ──
#
# Two hits in the vendored rung-5 tree are upstream's own documentation showing
# the FORMAT of GITHUB_APP_PRIVATE_KEY, not secrets:
#   rungs/5-software-developer-agent/README.md:148
#   rungs/5-software-developer-agent/apps/open-swe/.env.example:31
# Both contain a literal ellipsis between BEGIN and END:
#   -----BEGIN RSA PRIVATE KEY----- ... -----END RSA PRIVATE KEY-----
#   -----BEGIN RSA PRIVATE KEY-----\n...add your private key here...\n-----END…
#
# This keys on the property that makes them NOT secrets — a real PEM body is
# base64 and cannot contain "..." — rather than on where they live.
#
# DELIBERATELY NOT a path exclusion of rungs/**. We redistribute that tree, so a
# real leaked secret in vendored upstream becomes our problem the moment we ship
# it, and a path exclusion is a check that cannot fail over a subject that keeps
# growing. Proven: a genuine 2048-bit RSA key planted inside
# rungs/5-software-developer-agent/ is still caught with this allowlist active.
#
# WHY NOT path-AND-content scoping: gitleaks 8.21.2 has a single global
# [allowlist] whose `paths` and `regexes` combine with OR, and the top-level
# [[allowlists]] array with `condition = "AND"` is not supported in this
# version (verified — the block parses but has no effect). The regex therefore
# carries the narrowing on its own, which is why it demands the ellipsis.
# If gitleaks is upgraded to a version supporting [[allowlists]], tighten this
# to AND with paths = ['^rungs/5-software-developer-agent/.*'].
#
# REMOVE when upstream stops shipping ellipsis placeholders, or when the rung-5
# vendor pin is dropped. Delete it rather than widening it.
regexes = [
  '''BEGIN[A-Z ]*PRIVATE KEY-----[\s\S]{0,300}?\.\.\.[\s\S]{0,300}?-----END[A-Z ]*PRIVATE KEY''',
]

# Path-based exclusions. Next.js generates these files at build time;
# previewModeSigningKey/previewModeEncryptionKey are per-build random
# strings, not real secrets. They were accidentally committed in an
# old commit but the working tree has .next/ gitignored — the scan
# still surfaces them from history.
paths = [
  '''.*\.next/.*''',
  '''.*\.next-build.*''',
  '''.*\.svelte-kit/.*''',
  '''.*\.turbo/.*''',
  '''.*\.worktrees/.*''',
  '''node_modules/.*''',
  '''dist/.*''',
  '''build/.*''',
  '''coverage/.*''',
  '''playwright-report/.*''',
  '''test-results/.*''',
  '''pnpm-lock\.yaml''',
  # OpenAPI spec uses example bearer tokens for documentation.
  '''docs/openapi\.yaml''',
  # E2E test fixtures and example apps include placeholder tokens like
  # "test-token-abc" and "test-secret-token" — these are intentional
  # documentation/test artefacts, not real secrets.
  '''e2e/.*\.spec\.ts''',
  '''apps/example/.*\.env\.example''',
  '''apps/django-backend/.*\.env\.example''',
  '''apps/fastapi-backend/.*\.env\.example''',
]

# Specific commits to ignore (legacy accidental commits of .next/
# directory that have since been gitignored).
commits = [
  "efb82ae09c6b8a45b50558937e18e9f9cca9cf69",
]
