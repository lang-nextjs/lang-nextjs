version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Don't adopt a version the day it ships. Compromised releases are
    # typically caught and yanked within hours-to-days, so waiting is what
    # separates us from the blast radius. This is the same protection pnpm's
    # `minimumReleaseAge` would give, which we can't use — that setting needs
    # pnpm >=10.16 and this repo is pinned to 9.0.0. Applying it here covers
    # @version-claim package.json :: "packageManager": "pnpm@9.0.0"
    # the gap at the update layer instead.
    # Security updates deliberately bypass cooldown (a patch for a known CVE
    # should not wait), so this does not slow down the fixes that matter.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    # `@ai-sdk/react` pins `ai` to an EXACT version, and that pin moves with every
    # release: 3.0.199 -> ai 6.0.197, 4.0.80 -> ai 7.0.77, 4.0.96 -> ai 7.0.93.
    # So bumping either one alone installs TWO copies of `ai` and the react hook
    # fails at the boundary between them. The failure is two COPIES, not two
    # majors, and it can happen inside one major whenever the two drift apart.
    #
    # THE INVARIANT, STATED SO IT SURVIVES THIS CONFIG: the workspace's resolved
    # `ai` must EQUAL the version `@ai-sdk/react` pins. That is what breaks if
    # anyone removes this group, and unlike "they are grouped" it is checkable by
    # hand:
    #
    #   grep -oE '^  ai@[0-9.]+' pnpm-lock.yaml | sort -u
    #
    # must print ONE version, and it must be the one
    # `npm view @ai-sdk/react@<ours> dependencies.ai` reports. The `sort -u` is
    # load-bearing: pnpm names each package twice, once under `packages:` and
    # once under `snapshots:`, so a plain `grep -c` returns 2 on a HEALTHY tree.
    #
    # Grouping makes Dependabot open ONE pull request for both, which either
    # builds or does not. It does NOT guarantee a matching pair EXISTS — a group
    # carries whatever updates are available — but the vendor publishes them
    # together: of 88 stable `ai@7.x` releases, the number with no
    # `@ai-sdk/react` version pinning them is zero, and the two are published
    # about a minute apart.
    #
    # THIS ALSO SURVIVES THE COOLDOWN ABOVE, and that is measured rather than
    # documented — GitHub's reference describes `groups` and `cooldown`
    # separately and states no interaction. The mechanism that could bite is
    # bump TYPE: cooldown is 3/7/14 days by patch/minor/major, so two packages
    # released together but bumped differently would become eligible days apart
    # and a group PR formed in that window would carry one of them. Across 614
    # consecutive `@ai-sdk/react` releases, the number whose own bump type
    # differs from its pinned `ai` bump type is ZERO. Same minute, same
    # increment, same cooldown tier. If the vendor ever stops releasing in
    # lockstep, that reasoning expires and this group stops being sufficient.
    #
    # `@ai-sdk/*` matches one package today (`@ai-sdk/react`); a new one joins
    # automatically, which is wanted here because they are pinned to each other,
    # but it does mean one failing member holds up the rest of the group.
    groups:
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
      # EXACT-VERSION PEER PINS MUST MOVE AS A PAIR, OR THE TREE IS LEFT VIOLATED.
      # `@stryker-mutator/vitest-runner` declares `'@stryker-mutator/core': 9.6.1` —
      # an EXACT version, not a range — so a bump of either alone leaves nothing in
      # the tree satisfying the peer. That is stricter than the ai-sdk case above,
      # where a mismatch merely resolves two copies side by side.
      #
      # `@stryker-mutator/*` also covers api, instrumenter and util, which the
      # lockfile shows moving in lockstep at 9.6.1.
      stryker:
        patterns:
          - "@stryker-mutator/*"

      # vitest and its coverage provider pin each other EXACTLY and HAVE ALREADY
      # DRIFTED on main, which is how this group was found rather than predicted:
      #
      #     vitest@4.1.8              peers  '@vitest/coverage-v8': 4.1.8
      #     @vitest/coverage-v8@4.1.6 peers  vitest: 4.1.6
      #
      # Both constraints are violated at once, in both directions, because one side
      # was bumped and the other was not. Grouping stops the next divergence; it does
      # not repair this one, which needs a bump of the lagging side.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

      # REACT AND REACT-DOM MUST BE EXACTLY EQUAL, AND NO MANIFEST ANYWHERE SAYS SO.
      # This is stricter than stryker and vitest above, where the constraint at least
      # EXISTS in a peer field. `react-dom@19.2.8` declares `react: ^19.2.8` -- a CARET,
      # which 19.2.9 would satisfy -- so the declared range PERMITS the mismatch. What
      # actually forbids it is React's runtime check:
      #
      #     Error: Incompatible React versions: the "react" and "react-dom" packages
      #            must have the exact same version
      #
      # So resolution succeeds, install succeeds, and the pair fails at RUN time. That is
      # why #1110 installed fine and died in the test step, while #1111 died at install
      # for an unrelated reason -- one line, two mechanisms, two stages.
      #
      # Ungrouped, Dependabot opened them as two pull requests that were each unmergeable
      # and would have regenerated forever on every future react release.
      react:
        patterns:
          - "react"
          - "react-dom"
    # PRETTIER MAJORS ARE IGNORED, AND THE CONDITION FOR LIFTING THIS IS ON #577.
    #
    # `prettier` is pinned EXACTLY (#544), and the tree is formatted to that
    # version. A major bump that moves package.json and pnpm-lock.yaml WITHOUT
    # reformatting the tree leaves the gate measuring 2.x-formatted files with a
    # 3.x instrument.
    #
    # WHY assert-formatted.mjs DOES NOT ALREADY STOP THIS, which is the whole
    # reason an ignore is needed rather than a comment. That script refuses when
    # prettier is undeclared, out-of-tree, or `exact && resolved !== declared`.
    # A Dependabot bump moves the declaration and the lockfile TOGETHER, so
    # declared === resolved and every arm is satisfied. The refusal asserts "the
    # instrument is the version this repo chose"; what matters is "the instrument
    # matches the tree it measures". Those agree until the chosen version moves
    # without the tree, which is exactly the change being ignored here.
    #
    # AND IT WOULD LAND GREEN. The gate's subject is the files a branch changes,
    # not the tree, so a two-file bump passes its own gate and the failures
    # appear later, on unrelated PRs touching files written under 2.x.
    #
    # NOT "never" — prettier 2.x is unmaintained. #577 holds the decision and its
    # condition: bump once the version-independent backlog is cleared, as a
    # single reviewable style commit. Remove this entry when that is done.
    # Minors and patches are NOT ignored; only majors.
    ignore:
      - dependency-name: prettier
        update-types:
          - version-update:semver-major
      # TYPESCRIPT MAJORS ARE IGNORED, AND THE CONDITION FOR LIFTING THIS IS AN
      # EVENT RATHER THAN A DATE.
      #
      # Our TypeScript version does not govern our .d.ts output. tsup emits
      # declarations through a rollup-plugin-dts that its PUBLISHED BUNDLE froze
      # at its own build time: the installed
      # node_modules/.pnpm/tsup@8.5.1_..._typescript@6.0.3_.../dist/rollup.js
      # carries the literal `typescript@5.7.3`, twice, while the pnpm store key
      # on that same directory says typescript@6.0.3. The lockfile records the
      # compiler we handed tsup; the file records the compiler tsup runs. Only
      # the second one emits our declarations.
      #
      # WHY NO EXISTING CHECK STOPS THIS, which is why an ignore is needed rather
      # than a comment. A major bump is green everywhere we look: tsc typechecks
      # the source with the NEW compiler and passes, the build succeeds, and the
      # .d.ts files are still produced by the OLD baked one. No lockfile query can
      # see the baked version at all — it is a string inside a published bundle,
      # not a resolution — so the gap widens with every gate satisfied.
      #
      # TypeScript 7 is `typescript-go`, a different implementation rather than
      # an incremental major, so adopting it widens that gap by a whole rewrite.
      # That is what #1019 proposes and why it is not a routine bump.
      #
      # NOT "never". This lifts when tsup publishes a dist that no longer bakes a
      # TypeScript older than ours, and a date cannot observe that event.
      # scripts/assert-typescript-pin-justified.mjs reads the installed dist and
      # FAILS when it happens, naming this entry as the thing to delete. It fails
      # in the other direction too — if the repo's own major leaves 6 while this
      # entry stands — because this file constrains Dependabot, and a person
      # editing package.json is not Dependabot.
      #
      # Minors and patches are NOT ignored; only majors.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Actions are now SHA-pinned, so Dependabot rewrites the SHA and its
    # trailing `# vN` comment together. Same reasoning as npm above.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
