name: Security

# Runs on every push + PR, plus weekly schedule to catch newly disclosed
# vulnerabilities in unchanged dependencies. Three independent scans:
#   - Semgrep: SAST against the rulesets shipped by Semgrep (OWASP, security)
#   - Gitleaks: secret scanning across the full git history
#   - License check: fails on disallowed licenses in any production dep
#
# Each scan is its own job so a single tool's flake doesn't block the
# others. All three must pass to claim the security gate is green.

on:
  push:
    branches: [main, feat/ai-backend-matrix]
  # NO `branches:` FILTER HERE, DELIBERATELY.
  #
  # `pull_request.branches` filters on the BASE branch. While this read
  # `[main, feat/ai-backend-matrix]`, a pull request based on anything else
  # matched no trigger and ran NOTHING — and a PR page with no checks section
  # reads as fine to anyone scrolling past. Not a red we ignored, and not a
  # green over nothing: no checks at all.
  #
  # That is how #130 was merged with ZERO CI, gated on a named check that did
  # not exist. Every stacked PR had the same hole, which is most of them —
  # this team works in stacks routinely.
  #
  # An allowlist of base branches cannot survive that pattern: it needs editing
  # in six files every time someone opens a stack, and it is stale the moment
  # they do. So the filter is gone rather than widened. `push` keeps its filter;
  # that one is about which branches deserve a build, not about which pull
  # requests deserve review.
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    container:
      # Pinned. Unpinned this resolves to :latest, so the engine changed under
      # us between runs — a green build could go red with no commit. Bump
      # deliberately, so a new engine's findings land in a PR that says so.
      image: semgrep/semgrep:1.170.0
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve a Python interpreter (fail loudly if there is none)
        # The previous version of this gate was Node and died at `node: not
        # found` -- exit 127, before it could judge anything. The gate that
        # proves the gate can fail was itself unable to run, and 127 is not 1.
        #
        # So: resolve the interpreter explicitly and fail with a NAMED error if
        # there is none, rather than letting a later step exit 127 with a
        # message that reads like an unrelated infrastructure hiccup.
        run: |
          set -uo pipefail
          if command -v python3 >/dev/null 2>&1; then PY=python3
          elif command -v python  >/dev/null 2>&1; then PY=python
          else
            echo "::error::No Python interpreter in the semgrep container -- the"
            echo "::error::semgrep triage gate CANNOT RUN. This is a failure of the"
            echo "::error::gate, not a passing scan. Fix by either adding an"
            echo "::error::interpreter to this job, or splitting triage into a"
            echo "::error::separate job that consumes semgrep.json as an artifact."
            exit 1
          fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -V

      - name: Self-test the semgrep triage gate (proves it can fail)
        # Visible signal only. The same cases ALSO run in-process inside
        # semgrep_triage.py before it judges anything, so deleting this step
        # costs legibility but not safety -- which is the lesson from the Node
        # version, where the selftest was a separate step and that step is
        # exactly what vanished.
        run: $PY .github/workflows/semgrep_triage.py --selftest

      - name: Run Semgrep (OWASP + security-audit rulesets)
        # semgrep exits 0 (clean), 1 (findings), >=2 (the scan itself failed).
        # Those must not be conflated: a crashed scanner reporting "no findings"
        # is the fail-open shape this repo has removed repeatedly. Capture the
        # code, hard-fail on >=2, and hand findings to the triage gate.
        #
        # No --exclude for the vendored rung-5 tree. We redistribute it, so a
        # real vulnerability there is ours the moment a forker ships it.
        # Findings are triaged by name in .github/workflows/semgrep_triage.py.
        #
        # AND NO --exclude FOR THE PYTHON BACKENDS ANY MORE (#632). Two lines
        # excluded apps/django-backend and apps/fastapi-backend from SAST, and
        # nothing anywhere said why. Not an expired reason -- an ABSENT one:
        # there was no sentence to check, so re-reading the file could not
        # surface it, and the job stayed green either way.
        #
        # Worse than absent, because the surrounding context supplied a false
        # one. They sat in a list whose every other entry is a build artifact,
        # so the whole list read as one category and nobody registered that two
        # of its members are hand-written application source -- the server-side
        # request handling for two of the three runtimes, 35 files and ~8k
        # lines, including guarded_stream, the approval-policy parsing and
        # _error_origin.
        #
        # MEASURED BEFORE REMOVING, with this job's own pinned engine rather
        # than a local one: semgrep 1.170.0, p/owasp-top-ten + p/security-audit
        # + p/typescript + p/react, over both directories -- 230 rules, 29 files
        # (18 of them .py), ~100% parsed, 0 findings, 0 errors. The scanned-path
        # list was checked rather than the zero trusted, because a scan of no
        # files also reports none. So this costs nothing today and closes a hole
        # that would silently swallow whatever lands in those files next.
        run: |
          set -uo pipefail
          # AN ARRAY, SO EVERY EXCLUSION CAN CARRY ITS REASON NEXT TO IT.
          #
          # A backslash-continued command cannot hold comments -- a `#` on a
          # continued line comments out the REST OF THE COMMAND, silently
          # dropping every flag after it. Inside an array literal comments are
          # legal, which is why the gitleaks job below already builds ARGS this
          # way. This job's container has bash: `set -o pipefail` above already
          # depends on it, and it was checked in the pinned image.
          #
          # assert-scan-exclusions-justified.mjs holds this shape: each
          # --exclude must be preceded by a comment naming what it excludes. An
          # exclusion with a stated reason can be noticed going stale; the two
          # this file used to carry could not, because they said nothing.
          EXCLUDES=(
            # node_modules: installed dependencies, not source this repo writes
            # or ships. A finding here is a finding about the ecosystem, which
            # is what the license audit and dependency scanning are for.
            --exclude=node_modules
            # dist: compiled output of packages/*. Its source IS scanned, so a
            # finding here is the same finding twice, reported at a line number
            # that exists in no file anyone edits.
            --exclude=dist
            # .next: Next's generated bundles and cache -- build output, and the
            # same reasoning as dist.
            --exclude=.next
            # build: build output, same reasoning as dist.
            --exclude=build
            # .svelte-kit: SvelteKit's generated directory, same reasoning.
            --exclude=.svelte-kit
          )

          semgrep scan \
            --config "p/owasp-top-ten" \
            --config "p/security-audit" \
            --config "p/typescript" \
            --config "p/react" \
            "${EXCLUDES[@]}" \
            --metrics=off \
            --json --output=semgrep.json
          SG=$?
          if [ "$SG" -ge 2 ]; then
            echo "::error::semgrep failed to run (exit $SG) -- not treating this as 'no findings'"
            exit "$SG"
          fi
          "$PY" .github/workflows/semgrep_triage.py semgrep.json

  gitleaks:
    name: Secret scanning — Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # full history for thorough scanning

      - name: Install Gitleaks CLI
        # The gitleaks/gitleaks-action@v2 marketplace action requires a
        # paid license for non-open-source orgs. The standalone CLI has
        # no such restriction; install it directly from the official
        # release.
        #
        # Download to disk and verify the SHA256 against the published
        # checksums before executing, matching the approach already used in
        # DigitalFrontier-Website. Piping curl straight into `sudo tar` both
        # skipped verification and hid curl's exit code behind tar's, so a
        # failed or tampered download could produce a silently broken install.
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.21.2
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${BASE}/${TARBALL}" -o "${TARBALL}"
          curl -sSfL "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          # `awk $2 == f` is a literal string compare. grep would treat the
          # dots in the filename as wildcards, so a checksum line for a
          # similarly-named artifact could satisfy the match. Requiring exactly
          # one entry and failing loudly on zero means a renamed or absent
          # artifact can never reach the extract step unverified.
          EXPECTED="$(awk -v f="${TARBALL}" '$2 == f { print $1 }' checksums.txt)"
          if [ -z "${EXPECTED}" ]; then
            echo "::error::No checksum entry for ${TARBALL} in the published checksums"
            exit 1
          fi
          if [ "$(printf '%s\n' "${EXPECTED}" | wc -l)" -ne 1 ]; then
            echo "::error::Ambiguous checksum entries for ${TARBALL}"
            exit 1
          fi
          printf '%s  %s\n' "${EXPECTED}" "${TARBALL}" | sha256sum -c -
          tar xzf "${TARBALL}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "${TARBALL}" checksums.txt
          gitleaks version

      - name: Run Gitleaks
        # SCAN WHAT THIS EVENT IS READ AS ASSERTING (#215).
        #
        # `detect --source .` with `fetch-depth: 0` scans the whole object
        # graph — every branch that came down with it. So on a pull request it
        # answered "does a finding exist anywhere in this repository's refs",
        # while every reader takes a PR check to mean "does THIS pull request
        # introduce one".
        #
        # Measured: PR #210 went red naming
        #   packages/react/src/useApprovalResponse.test.tsx:565  commit 3c75954
        # which is on feat/170b-app-owner-key — a different branch, a different
        # author, not an ancestor of #210's head or of main.
        #
        # Three costs, and the false red is the smallest. It is UNATTRIBUTABLE,
        # so the reader's first assumption is that the secret is theirs. It reds
        # EVERY open PR at once, so one branch blocks the board until its owner
        # happens to fix it. And it teaches people to wave the scanner through —
        # which this repo has already done once, merging past a check excluded
        # as "known-red".
        #
        # The mirror-image defect is worth naming too: a finding vanishes from
        # everyone's PR the moment its owning branch is deleted, with no change
        # to their code. A green that arrives for reasons the author cannot see
        # is the same defect pointing the other way.
        #
        # So the RANGE is the fix, not the tool. On a pull request, scan the
        # commits the pull request actually adds. Everywhere else — push to
        # main, the weekly schedule — repo-wide is the right question and there
        # is no PR to mislead, which keeps `.gitleaks.toml`'s insistence that a
        # real secret in vendored upstream becomes our problem.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          ARGS=(--source . --config .gitleaks.toml --no-banner --redact --verbose)

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "${BASE_REF}"
            RANGE="origin/${BASE_REF}..HEAD"
            COUNT="$(git rev-list --count "${RANGE}")"
            # A range that matches nothing would scan nothing and exit 0 — a
            # green proving only that the range was wrong. Say so instead.
            if [ "${COUNT}" -lt 1 ]; then
              echo "::error::${RANGE} contains no commits; this scan would pass without examining anything"
              exit 1
            fi
            echo "scanning ${COUNT} commit(s) this PR adds over ${BASE_REF}"
            ARGS+=(--log-opts "${RANGE}")
          else
            echo "scanning full history (${GITHUB_EVENT_NAME})"
          fi

          gitleaks detect "${ARGS[@]}"

  licenses:
    name: License audit — production-deps allowlist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Use pnpm's built-in license listing — handles workspaces and
      # private packages natively without the parsing failures we hit
      # with license-checker on the workspace root.
      #
      # The decision logic lives in .github/workflows/license-audit.js rather
      # than inline here, so it can be run against fixtures and PROVEN to
      # reject — see the selftest step below. It reads the resolved production
      # dependency tree, never a hardcoded package list.
      - name: Self-test the license gate (proves it can fail — do not remove)
        # A per-package exception is easy to write as "matches nothing and
        # therefore passes". This asserts the decisive case: a DIFFERENT
        # unlicensed dependency must still fail. If this step is deleted, the
        # exception can silently decay into a blanket UNLICENSED allowlist.
        run: node .github/workflows/license-audit.selftest.js

      - name: Audit production-dep licenses
        run: |
          pnpm licenses list --prod --json > /tmp/licenses.json
          node .github/workflows/license-audit.js /tmp/licenses.json

  rung5-patches:
    name: Rung 5 — vendored security patches still hold
    runs-on: ubuntu-latest
    # ---------------------------------------------------------------------
    # WHY THIS JOB EXISTS (#86). rungs/5-software-developer-agent is vendored and
    # pinned, and diverges from upstream in exactly two places, both security
    # fixes: #84 (the GitHub webhook verifies its signature; upstream read the
    # header and never compared it) and #82 (the AES key is derived with scrypt
    # and a per-ciphertext salt; upstream used a single-pass SHA-256).
    #
    # security-patches.test.mjs proved both, BEHAVIOURALLY, when it was written —
    # and then nothing ever ran it again. It lives under the vendored tree's own
    # yarn toolchain, our vitest cannot import across that dependency graph, and
    # no workflow invoked it. The webhook could stop verifying and the KDF could
    # revert to a fast hash with every gate we have still green.
    #
    # It is not free: it needs the vendored tree's own install and build. That is
    # the price of the properties being durable rather than historical.
    #
    # DELETE THIS JOB when the patches are upstreamed and the pin moves past
    # them. It is only meaningful while the tree is BOTH vendored AND divergent;
    # PROVENANCE.md's patch manifest is what tells you that has stopped being
    # true. A gate whose subject no longer exists is worse than no gate.
    # ---------------------------------------------------------------------
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      # Runs UNGUARDED and FIRST, deliberately. It exercises only the gate's
      # verdict logic against synthetic TAP — no vendored tree, no yarn — so it
      # is meaningful even in a fork that has no rung 5, and it is the thing that
      # proves the gate below can actually fail.
      - name: Self-test the rung-5 gate (proves it can fail — do not remove)
        run: node scripts/assert-rung5-security-patches.selftest.mjs

      - name: Self-test the rung guard (proves it can fail — do not remove)
        # THIS WORKFLOW GATES STEPS ON has-rung.mjs AND ITS PROOF RAN ELSEWHERE.
        # ci.yml and severability.yml both invoked the selftest; neither gates this
        # workflow, and workflows fire independently. So every run here trusted a guard
        # nothing in this file had watched fail.
        #
        # The failure mode is silent by construction: a misinvocation makes the guard
        # answer "" instead of yes/no, the caller reads that as "rung absent", and the
        # guarded step SKIPS while the job stays green. That is the defect the guard was
        # written to prevent, so it is the one its proof has to run next to.
        # No pnpm in this job — the selftest is node-only, so it is invoked directly.
        run: bash scripts/has-rung.selftest.sh

      - name: Verify the vendored security patches still hold
        run: |
          # Guarded on the manifest: a rung-1/2/3/4 fork has no rung-5 tree, and
          # the patched code is deleted along with it — there is no unpatched
          # dependency left behind to gate, so skipping is correct rather than a
          # hole. scripts/ is retained by every eject, so without this guard a
          # fork's CI would invoke a checker whose subject does not exist.
          #
          # The EXIT CODE is checked, not just stdout: `$( )` inside a `[ ]`
          # comparison discards it, which is how an earlier guard elsewhere in
          # this repo skipped silently on any misinvocation.
          if ! __rung=$(node scripts/has-rung.mjs software-developer-agent); then
            echo "FAIL: cannot determine whether the software-developer-agent rung is present" >&2
            exit 1
          fi
          # AND THE VALUE MUST BE IN DOMAIN. The exit code above only proves the guard RAN.
          # Anything other than yes/no means its contract changed under this caller, and the
          # comparison below would read it as "absent" and skip — the silent skip again, one
          # layer in. "I cannot tell" must never be spelled the same as "no".
          case "$__rung" in
            yes|no) ;;
            *) echo "FAIL: has-rung answered '$__rung' for software-developer-agent, outside {yes,no}" >&2; exit 1 ;;
          esac
          if [ "$__rung" != "yes" ]; then
            echo "software-developer-agent rung not in this tree — skipping"; exit 0
          fi
          corepack enable
          node scripts/assert-rung5-security-patches.mjs
