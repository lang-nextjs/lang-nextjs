name: CI

on:
  # NO `branches:` FILTER HERE, DELIBERATELY.
  #
  # `pull_request.branches` filters on the BASE branch. While this read
  # `[main, feat/ai-backend-matrix]`, a pull request based on anything else
  # matched no trigger and ran NOTHING — and a PR page with no checks section
  # reads as fine to anyone scrolling past. Not a red we ignored, and not a
  # green over nothing: no checks at all.
  #
  # That is how #130 was merged with ZERO CI, gated on a named check that did
  # not exist. Every stacked PR had the same hole, which is most of them —
  # this team works in stacks routinely.
  #
  # An allowlist of base branches cannot survive that pattern: it needs editing
  # in six files every time someone opens a stack, and it is stale the moment
  # they do. So the filter is gone rather than widened. `push` keeps its filter;
  # that one is about which branches deserve a build, not about which pull
  # requests deserve review.
  pull_request:
  push:
    branches: [main, feat/ai-backend-matrix]

concurrency:
  group: ci-${{ github.ref }}
  # CANCEL ON BRANCHES, NEVER ON MAIN (#115). Superseding a PR's in-flight run
  # is right: the newer commit is the one anyone cares about, and the old run's
  # verdict is about code nobody will merge.
  #
  # ON MAIN IT INVERTS THE MEANING OF THE BOARD. A cancelled run reports NO
  # VERDICT — not a weak pass, not a partial one, the absence of a measurement —
  # and nothing in how the board is read distinguishes "passed" from "never
  # finished". With this set to true, 47% of main's runs were cancelled, so main
  # was measured half as often as it appeared to be, and a real failure sat
  # unnoticed among grey icons. Activity suppressed verification, which is
  # exactly backwards: the busier main got, the less it was actually checked.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Build, Test, Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # FULL HISTORY, because assert-no-undeclared-reverts.mjs compares each changed file
          # against the states it held at ancestors of the base. The default is fetch-depth: 1,
          # and with one commit of history every file's past is empty: the check finds no
          # revert no matter what the branch did, and exits 0. It refuses a file whose past is
          # cut rather than answer, so leaving this out turns that check RED, not quietly green.
          #
          # IT DOES BRING OTHER BRANCHES, and a comment here previously claimed the opposite.
          # actions/checkout with fetch-depth: 0 fetches `+refs/heads/*:refs/remotes/origin/*`,
          # so `specimen/stale-tree-reverts-398` — the preserved defect the proof runs against —
          # arrives with everything else. Run 33337957786 line 807 shows it doing exactly that.
          # The bundle under scripts/fixtures/ is a fallback for clones that have main but not
          # that branch; it is not what supplies the specimen here.
          #
          # IT IS ALSO NOT SUFFICIENT ON ITS OWN — see the deepening step further down, which
          # sits next to the check that needs it because the boundary appears DURING the run,
          # not at checkout.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      # BEFORE THE INSTALL, AND THAT PLACEMENT IS THE POINT (#585).
      #
      # A tracked `node_modules` path makes pnpm fail to mkdir, so every job that installs
      # dies at the step below with ENOTDIR. 26 of them did, identically, which is the
      # signature of a runner outage rather than a repo defect — hours went into believing CI
      # was broken. These two steps put ONE named red at the top of that, saying which path.
      #
      # They cannot live in checks.json: `pnpm checks` runs AFTER the install, so a check
      # registered there could never speak about an install that did not happen. Node and git
      # are both available at this point; neither script needs a dependency.
      - name: Prove the install-blocking-path check
        run: node scripts/assert-no-install-blocking-paths.selftest.mjs

      - name: No install-blocking paths in the tree
        run: node scripts/assert-no-install-blocking-paths.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # npm retired the legacy audit endpoint this step depends on; it now
        # answers 410 for every request. Every pnpm version (9 and 10 both
        # verified) still calls it, so this can never pass and was silently
        # gating Build/Test/Typecheck behind a dead upstream service.
        # CVE coverage now comes from Dependabot security alerts (GitHub
        # advisory DB). Left here, non-blocking, so it resumes gating on its
        # own if pnpm migrates to the bulk advisory endpoint.
        continue-on-error: true
        run: pnpm audit --audit-level=moderate

      - name: Build
        run: pnpm build

      - name: Test (with coverage thresholds enforced per package)
        # Each package's vitest.config.ts declares its own coverage thresholds.
        # A package falling under threshold fails the run here. To raise a
        # threshold, edit the relevant package's vitest.config.ts.
        run: pnpm test

      - name: Typecheck (includes public-api.test.ts type assertions)
        # Type tests live in packages/*/src/public-api.test.ts. They run
        # under vitest (above) AND must type-check here. Either failure mode
        # surfaces a public API drift before consumers hit it.
        run: pnpm typecheck

      # --- Package severability: no rung or runtime leaks into a sibling's dist -------------
      #
      # These four checks were previously inline `grep ... && exit 1 || echo Clean` (and
      # `if grep ...; then FAIL else Clean fi`) one-liners. None of them was capable of
      # failing. See scripts/assert-dist-clean.sh for the full account; the short version:
      #
      #   * grep exits 2 on a MISSING file, and both old forms routed that into their
      #     success path — so a deleted, unbuilt, or renamed dist reported "Clean", exit 0.
      #   * the patterns hardcoded `require("` (double quote, CJS). tsup preserves source
      #     quote style and this repo emits SINGLE-quoted specifiers, so the checks could
      #     not match their own build output in any form.
      #   * two of the four subjects are ESM files, where `require(` never appears at all.
      #
      # `set -euo pipefail` would NOT have fixed this: POSIX exempts `&&`/`||` operands and
      # `if` conditions from `-e`, which is exactly what both old forms were.
      #
      # The self-test step below MUST run before these and MUST stay. It proves the checker
      # returns non-zero on poisoned and on absent input. A checker never observed to fail
      # is indistinguishable from one that cannot.

      # --- Rung classification (CHECK-1 of #1) ----------------------------------------------
      #
      # rungs.json is the single authority on what a rung is, and this is the census that
      # `pnpm eject` and the severability matrix are built on. Runs on every PR, UN-ejected, so
      # an unclassified rung file fails the moment it lands rather than weeks later at eject
      # time — which is how a close condition once went green with nine rung files still
      # shipping.
      #
      # Same rule as the dist checks: the self-test runs FIRST and proves the classifier can
      # fail, by mutating the real manifest once per gate.

      - name: Self-test the manifest schema (proves it can ACCEPT, not just reject)
        # The accept case is the load-bearing one. rungs.json grew a `docs` plane while the
        # schema still declared additionalProperties:false over {ts,py}, so the schema rejected
        # the REAL manifest — and therefore rejected every document, valid or not. Injecting
        # forbidden fields still produced "rejected", so the prohibition looked like it worked.
        # A validator that rejects everything is indistinguishable from one that rejects the
        # right things, unless something asserts a known-good document is ACCEPTED.
        run: pnpm test:rungs-schema

      - name: Check - rungs.json validates against its schema
        run: pnpm rungs:validate

      - name: Self-test the rung classifier by mutation (proves it can fail — do not remove)
        run: pnpm test:rungs

      - name: Check - shared-glob membership matches the frozen census
        # Catches THE FILE NOBODY NOTICED. Classification stays total and disjoint when a rung
        # file lands under a shared glob, every test passes, and the fork builds — so nothing
        # else here objects. attribution.pipeline.test.ts sat misclassified for 29 commits that
        # way, with `pnpm eject` failing on main throughout.
        #
        # Two globs only, and rungs.json `shared._censusNote` carries the measurement behind
        # that: freezing all 23 would need a manifest edit on 52% of commits, and a freeze
        # edited that often gets rubber-stamped. The refusal is written down so its absence
        # elsewhere reads as a decision rather than an oversight.
        run: pnpm census

      - name: Self-test the shared census by mutation (proves it can fail — do not remove)
        # Plants each defect it claims to catch — a new shared file, a vanished member, a glob
        # dropped from shared.paths, an unparseable freeze — plus the ACCEPT half, that a
        # rung-owned file under the same glob is ignored. Without that last one a check which
        # refused everything would score full marks.
        run: pnpm test:census

      - name: Check - no shell discards the verdict it reports
        # #216: `tsc … | grep … | head` reported CLEAN over 43 errors, because a
        # pipeline's status is its LAST command's. `| head` is a verdict-
        # destroying operation wearing the clothes of presentation, which is why
        # it survives review. Both people who tripped this had written or read
        # the rule — it has to be enforced at the moment of typing, not in a doc.
        run: pnpm shell-verdicts

      - name: Self-test the shell-verdict checker (proves it can fail)
        # Plants each shape, including the continuation-line form the checker
        # ITSELF passed over in its first version, plus the safe forms the issue
        # prescribes — a checker that refuses everything is equally useless.
        run: pnpm test:shell-verdicts

      - name: Check - no shell parses a command string
        # #736: `execSync("docker ps ... 2>/dev/null || true")` made "nothing
        # leaked" and "I could not ask docker" the same verdict, and the second
        # passed. Anchored on the IMPORT, not the call site: `exec`/`execSync`
        # take a string a shell parses, the argv APIs cannot. e2e/ may shell out
        # and is still held to R2 — the verdict must survive.
        run: pnpm argv-form

      - name: Self-test the argv-form checker (proves it can fail)
        # After #736's site fixes nothing in the repo imports the shell form, so
        # the domain is EMPTY and the checker passes whether or not it works.
        # Only the planted rejections tell those apart.
        run: pnpm test:argv-form

      - name: Self-test freeze:all by planting the deadlock it exists to break
        # freeze:all is a WRITER, so when it is wrong it does not go red - it records
        # counts nobody measured, which is the whole of #145. Both directions asserted:
        # it must resolve a genuine deadlock, AND still refuse a C4 dead glob while
        # leaving both artifacts untouched. A refusal that already wrote one is worse
        # than no exit at all, because the message reads as safety.
        run: pnpm test:freeze-all

      # The shared writer both freezes go through (#622). Its proof plants a tree whose
      # census actually MOVES, re-freezes, and requires the artifact to pass the format
      # gate with no manual formatting -- the loop that made rungs.json and
      # shared-census.json fail `prettier --check` the moment they were regenerated.
      - name: Generated JSON is written gate-clean
        run: pnpm test:generated-json

      - name: Check - every declared data-* part has a producer and a consumer
        # NO LONGER MONOREPO-ONLY. This used to carry a note that an ejected fork failed it,
        # because eject pruned barrels, playwright projects and python registries but not the
        # protocol declarations — a rung-1 fork declared 11 data-* parts and could produce 3.
        # #89 closed that: eject now prunes SCHEMA_MAP and docs/sse-frame-schema.json by
        # `x-emitted-by`, and severability.yml runs this same check inside every ts fork. The
        # fork's green is earned rather than exempted.
        run: pnpm payloads

      - name: Check - every ✓ requirement names a test that exists
        # Verifies a citation EXISTS and RESOLVES. It CANNOT verify the cited test actually
        # tests the requirement — #36's ADAPT-01 kept twelve tests green with the pipeline
        # order flipped, which no link checker catches. This converts unverifiable claims into
        # human-checkable ones; a green run is not evidence a requirement holds.
        run: pnpm traceability

      - name: Self-test `pnpm format` by mutation (proves it uses the pinned prettier — do not remove)
        # Runs in a tree with NO node_modules, which is the configuration the fix is for:
        # "run it and see 2.8.8" passes on every machine except the broken one. Also puts a
        # DIFFERENT prettier earlier on PATH and requires the workspace one to win — without
        # that case, "it printed a version" says nothing about WHICH tool answered.
        run: pnpm test:format

      - name: Self-test the traceability checker by mutation (proves it can fail — do not remove)
        # The load-bearing case is TOTALITY: a checker that validates only rows which happen to
        # carry a citation passes cleanly on a file with zero citations, which is today's state.
        run: pnpm test:traceability

      - name: Self-test the payload triangulation by mutation (proves it can fail — do not remove)
        # Plants each defect the check claims to catch — a third orphan, a part losing its only
        # renderer, a stale allowlist entry, an unparseable registry — and asserts a non-zero
        # exit. Writing it found two defects in the check itself: index.ts re-exports every
        # type, so every part had a "consumer" and half the check was vacuous; and the parse
        # anchor prefix-matched a renamed variable, making one mutation inert.
        run: pnpm test:payloads

      - name: Check - rung classification is total and disjoint
        run: pnpm rungs

      - name: Check - generated rung types match rungs.json
        run: node scripts/gen-rung-types.mjs --check

      - name: Check - no workflow filters pull_request on the base branch
        # A PR based outside the filter's list runs NO checks and shows NO
        # checks section, which reads as fine. That is how #130 reached main
        # with zero CI while being gated on a named check that never ran.
        run: pnpm check:pr-triggers

      - name: Self-test the pull_request-trigger check (proves it can fail)
        run: pnpm test:pr-triggers
      - name: Check - every e2e spec is registered with a Playwright project
        # A spec matched by no project NEVER RUNS. It exists, reads well, passes
        # review, and executes zero times — the suite goes green BY ABSENCE, before
        # a single assertion is evaluated, so nothing downstream can notice. Two
        # people hit this independently in one night (#135, and the chat/settings
        # spec) because several testMatch patterns are per-FILE and exact.
        #
        # Both directions: an orphan spec, and a project whose pattern matches
        # nothing (a rename leaves the pattern pointing at a ghost, and that
        # project then runs zero tests and passes).
        run: pnpm check:e2e-registration

      - name: Self-test the e2e registration checker (proves it can fail)
        # A checker for "reports green by absence" that itself passed vacuously
        # would put a green tick on the exact state it exists to refuse.
        run: pnpm test:e2e-registration

      - name: Self-test eject's guards (refuses a stale census, proceeds on a healthy one)
        # The severability matrix exercises eject's happy path across 8 forks. It cannot
        # exercise the REFUSAL paths, which only fire on input a healthy repo never produces —
        # so nothing else would notice if one silently stopped working. Both directions are
        # asserted: refusing everything is as useless as refusing nothing.
        run: pnpm test:eject

      - name: Self-test the matrix generator (proves the arity cannot silently be wrong)
        # matrix.mjs decides how many severability jobs run. A generator emitting nothing, or
        # missing a rung, is a green board over no verification — the shape this milestone
        # removed, in the mechanism that removes it. It shipped without a selftest.
        run: pnpm test:matrix

      - name: Self-test that dev-all.sh exports the agent's URLs before forking it
        # A child inherits the environment AS IT WAS AT FORK. dev-all.sh started the queue
        # agent ten lines above `export FASTAPI_URL`, so MODEL_BACKEND resolved to "" and
        # EVERY queue run was scripted — always, whatever the key. Nothing was red: the
        # script started everything and reported success, and the agent's banner blamed the
        # model. Three rounds of diagnosis went past it.
        #
        # The constraint that keeps it fixed is an ORDER inside one file, which is exactly
        # the kind that expires unnoticed on the next reorder. Has its own control arm.
        run: pnpm test:dev-env-order

      - name: Self-test the E2E flake meter (proves the #675 partitions stay disjoint)
        # measure-e2e-flake.mjs is the only instrument that can see the #675 flake at all —
        # `retries: 1` converts an occurrence into a green, so job conclusions are structurally
        # blind to it. #708 then makes the wait ABSORB an occurrence, which removes it from the
        # flaky block too. The absorbed partition is what keeps the rate measurable, and the
        # measurement is the only thing separating that remedy from a mute button.
        #
        # This selftest also existed and was invoked by nothing. Wired here, green at wiring.
        run: pnpm test:e2e-flake-meter

      - name: Self-test dev-all.sh's hold/exit decision
        # Already existed and was invoked by NOTHING — a selftest that never runs is the
        # "names a property and cannot fail" shape this repo keeps finding. Wired here in
        # the commit that discovered it, green at the time of wiring.
        run: pnpm test:dev-hold

      - name: Self-test the rung guard (proves a failure is distinguishable from "absent")
        # has-rung.mjs decides whether CI steps run at all. Its callers discarded its exit code,
        # so any misinvocation silently skipped the guarded step and left the job green.
        run: pnpm test:has-rung

      - name: Self-test the live-transport failure classifier (#400)
        # NOT IN scripts/checks.json, and the reason is structural: that registry
        # pairs a PROOF with a repo-wide CHECKER, and this one has no checker
        # half. It classifies a specific job's output, so there is nothing for it
        # to check when run over the tree. A registry entry with an empty checker
        # would be a declared execution that executes nothing.
        #
        # The proof still runs here, because the classifier decides how an
        # upstream outage is presented versus a transport defect. One that has
        # only ever been watched agreeing with "upstream" is indistinguishable
        # from one that says "upstream" unconditionally — and it would relabel
        # every genuine break as someone else's problem. Its fixtures are frames
        # this repo's real error path produced, and it is watched saying DEFECT.
        run: |
          pnpm test:live-classify
          # The retry POLICY, not just the classifier. It decides whether an
          # upstream-only failure is retried and whether a second one goes red,
          # and the case it must never get wrong is a DEFECT on the retry being
          # swallowed by a retry that was allowed for an outage.
          pnpm test:live-retry
          # The CROSS-RUN reader (#664). It decides whether a red is presented as
          # the sixteenth of an external cause or the first of a new one, and the
          # case it must never get wrong is an unreadable window reporting a
          # defect streak of zero — which reads as a clean transport.
          pnpm test:verdict-streak
          # The EMITTER/PARSER contract (#664). If those two drift, every live
          # failure classifies as FAILED_UNCLASSIFIED — the same word the
          # classifier correctly prints for a job that died before producing a
          # frame, so a broken classifier and a bad week read identically.
          pnpm test:error-frame-contract

      - name: The classifier's input survives the run it explains (#440)
        # A VERDICT NOBODY CAN RE-DERIVE IS NOT EVIDENCE. main went red at
        # 7e46fa6 with `TRANSPORT_DEFECT defects=2 upstream=2`; the same
        # classifier at the same commit, fed the published job log, returned
        # `UPSTREAM_UNAVAILABLE defects=0 upstream=4` — the opposite verdict and
        # the opposite retry advice. The file it had actually read was gone, so
        # neither answer could be checked and the disagreement was unresolvable
        # by construction.
        #
        # HERE RATHER THAN scripts/checks.json, for the reason given on the step
        # above: this pairs a workflow declaration with a shell script's write
        # path, both inside e2e.yml's live-transport job, and it has no meaning
        # run over an ejected fork that does not contain that job.
        #
        # The proof runs first and is the one that matters: the checker iterates
        # the steps that invoke the wrapper, so if that script is ever renamed it
        # would examine an empty set and pass. The selftest drives exactly that
        # case, which cannot be reached by editing the real tree without turning
        # CI red.
        run: |
          pnpm test:live-artifact
          pnpm live-artifact
      - name: Every manifest discriminant has a coverage decision (#425)
        # `shape` is exhaustive at the type level and unguarded at every consumer:
        # a third value gets run nav from the sidebar's `!== "conversation"` and
        # vanishes from the framework selector's `=== "conversation"`, silently and
        # in opposite directions at once. assertNever and the derived union catch a
        # value the TYPE does not know; neither catches a value a CALL SITE does not
        # handle, because an if/else over a wider union still typechecks.
        #
        # NOT A `shape` CHECK, deliberately. `state` has the same structure and #451
        # adds `reach` this week. A guard shaped around `shape` would make the next
        # discriminant HARDER to notice, because the manifest would then look like it
        # has discriminant coverage — so this derives the family from the generated
        # types and requires a written decision per member.
        #
        # It reports gaps rather than closing them, and says so in its own output.
        # The proof runs first: the case that matters — a fourth field arriving —
        # cannot be reached by editing this tree, so it is driven synthetically.
        run: |
          pnpm test:discriminants
          pnpm discriminants

      - name: One CORS allowlist, three backends (#349)
        # All three hardcoded the dev origins and none read an environment
        # variable, so a fork had no supported way to change the allowlist at
        # deploy time. The copies had ALREADY drifted — django omitted
        # http://localhost:3000 that the other two allowed, and nothing said so.
        #
        # A SOURCE check because the django backend has no test harness and no
        # package.json, the same constraint check-run-axes-parity.mjs works
        # around. fastapi and node assert the behaviour directly in their own
        # suites; this asserts the thing no test could, which is that all three
        # still agree with one declared list.
        run: pnpm cors-parity

      - name: Self-test the CORS parity checker
        # It stands in for a test django cannot have, so it is the ONLY
        # assertion covering that plane. A source check that cannot fail would
        # leave a backend covered by nothing while reading as covered — worse
        # than the hardcoded list it replaced, which at least did not claim to
        # be checked.
        run: pnpm test:cors-parity

      - name: The rung docs still describe the code (#364)
        # docs/rungs/*.md asserted measurable facts and nothing re-measured them.
        # One told forkers to pick FastAPI over Django because deep-research was
        # "FastAPI only" — a gap Django had since closed on purpose. The same
        # false claim sat in three places across two files, and a security
        # warning pointed at a path that named the WRONG APP.
        #
        # A doc that names a divergence is exactly the doc that must be
        # re-measured when the divergence closes, and nothing fails when it does.
        run: pnpm doc-claims

      - name: Self-test the doc-claims checker (proves it catches a CLOSED divergence)
        # The forward mutation — edit a doc, watch it go red — is the easy half
        # and would not have caught what happened: nobody edited the doc. The
        # selftest therefore asserts the INVERSE, with the doc byte-identical and
        # a runtime gaining a topology, which is the case that actually occurred.
        #
        # It also caught a real hole during development: the vacuity guard lived
        # inside the human-output branch, so `--json` returned exit 0 and an
        # empty finding list for an empty world.
        run: pnpm test:doc-claims

      - name: The scripts index names files that exist (#328)
        # A WEAK CHECK THAT CAN FAIL BEATS A STRONG CLAIM THAT CANNOT.
        #
        # .planning/scripts-question-index.md exists because three sessions in one
        # evening re-derived conclusions already written in scripts/ headers. It
        # cannot assert that a description is still ACCURATE -- no checker settles a
        # claim about meaning, and the index says the file wins where they disagree.
        # It can assert every file it names is THERE, which is the decay that
        # actually happens: a script renamed while the index kept pointing at it.
        #
        # Without this, an index whose every entry had rotted would look exactly
        # like one still true.
        run: pnpm index-paths

      - name: No e2e loop can assert nothing (#328)
        # SHAPE A ONLY, and the shape choice is the substance. A loop carrying both a
        # skip guard and an expect() can execute zero assertions and still pass — the
        # live instance skipped every iteration because the elements it measured had
        # become <option>s with no bounding box. It stayed green.
        #
        # Shape B (an unbounded [data-testid^="..."] prefix) is REPORTED by the same
        # script and deliberately NOT gated: its five current hits are all correct, the
        # two rename- testids being arms of one ternary. Gating on them would teach
        # people to widen an allowlist, which is how a gate stops meaning anything.
        run: pnpm vacuity

      - name: Self-test the vacuity sweep (proves a zero from it means something)
        # The sweep's whole purpose is to distinguish "nothing found" from "searched
        # wrong", so an uncalibrated sweep would be an instance of its own subject. The
        # selftest runs it against the two REAL instances recovered from 9b5e64e and
        # fails if it does not find them — and watches `--strict A` exit 1, because a
        # gate seen only exiting 0 is indistinguishable from one that cannot exit 1.
        #
        # This caught a genuine break during development: --defs received absolute
        # paths, join(cwd, abs) walked nothing, and shape B reported a confident zero
        # while being structurally unable to find anything.
        run: pnpm test:vacuity

      - name: No hardcoded Tailwind palette on a themed surface
        # WIRED IN #117. check-palette.mjs and its selftest existed and ran NOWHERE in CI —
        # every other structural checker here has both a checker step and a selftest step;
        # palette had neither. So the exclusion this PR retires was justified by a count
        # ("237 -> 0") that nothing in CI was measuring, and it could have drifted back up
        # in silence with the board green the whole time.
        #
        # apps/open-swe is deliberately NOT a root here — it checks itself from its own
        # package.json, reached by `turbo test`, because this workflow is retained by every
        # eject and apps/open-swe is not. See scripts/check-palette.mjs's DEFAULT_ROOTS.
        run: pnpm palette

      - name: Self-test the palette checker (proves it can fail)
        # The one branch that matters: check-palette resolves its entry point through
        # realpathSync, and got that wrong once already — invoked via a symlinked path the
        # comparison was false, main() never ran, and node exited 0 with no output over a
        # tree with 237 findings. It was reported as "already clean". A checker whose
        # failure mode is silent success needs a selftest more than most, and this one
        # spawns the script through a symlink specifically to reach that branch.
        run: pnpm test:palette

      - name: Committed visual baselines are for the platform CI reads
        # Playwright names snapshots by PLATFORM ONLY — never by architecture, never
        # by runner. The gate runs on ubuntu and visual-baselines.yml is
        # workflow_dispatch on ubuntu-latest by design, so a committed -darwin.png is
        # read by exactly one audience (a Mac developer running locally) and is
        # regenerated by nothing. #125 measured the result: the same four screens at
        # darwin 20128 B vs linux 37266 B — a different rendering, not drift.
        run: pnpm visual-baselines

      - name: Self-test the baseline platform check (proves it can fail)
        # Its most important case is the vacuity one. This checker reports on files
        # that may not exist, so "0 offenders" over an empty tree is indistinguishable
        # from clean unless it refuses to answer — the shape behind `census agrees`
        # with nothing enumerated. It exits 2 on no subject rather than 0.
        run: pnpm test:visual-baselines

      - name: Lint the workflows, and PROVE shellcheck was there to lint them with
        # actionlint only lints `run:` blocks when shellcheck is on PATH. Without it it does
        # not warn, does not annotate, and does not change its exit code — it silently skips
        # every shell block and reports success. Measured on this repo at 773477c, same
        # command, same files, minutes apart:
        #
        #     with shellcheck 0.11.0 : exit 1, 1 finding
        #     without shellcheck     : exit 0, 0 findings
        #
        # The second result is not "the workflows are clean". It is "no shell was examined",
        # presented identically to clean. Any claim of the form "actionlint passes" is
        # unfalsifiable until you know which of those two happened (#146).
        #
        # So the DEPENDENCY IS ASSERTED before the tool is trusted, and the version is echoed
        # so a green run carries evidence of what it actually covered. GitHub's ubuntu runners
        # ship shellcheck today; this step exists for the day an image drops it, which would
        # otherwise turn this gate off without turning it red.
        #
        # actionlint is pinned and checksummed rather than curl|bash-installed, matching how
        # every action here is pinned by SHA.
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "FAIL: shellcheck is not on PATH."
            echo "      actionlint would skip every run: block and still exit 0 — a pass that"
            echo "      covers no shell at all. Refusing to report that as clean."
            exit 1
          fi
          shellcheck --version | sed -n 's/^version: /shellcheck version /p'
          tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSLf -o "$tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tgz}"
          echo "${ACTIONLINT_SHA256}  ${tgz}" | sha256sum -c -
          tar xzf "$tgz" actionlint
          ./actionlint -color

      - name: Self-test the topology declaration check (proves it fails BOTH directions)
        # Adding a topology to rungs.json is one line; making it true is a tool, a prompt,
        # a graph and a dispatch entry. The accept case matters as much as the refusals:
        # a pair declaring no topologies must be SKIPPED, or a checker that refused
        # everything would score full marks.
        run: pnpm test:topologies

      - name: Check - every declared topology is served by its topologiesSource
        # `topologiesSource` sat in the schema and in gen-rung-types with NOTHING reading it:
        # the manifest named its own source of truth and no check compared them. The UI derives
        # its Mode buttons from this manifest, so a topology declared and not implemented is a
        # button that 400s. Both directions are checked — an undeclared topology in the module
        # is a capability no surface will ever offer.
        run: pnpm topologies

      - name: Self-test the silent-skip gate (proves it spares conditional skips)
        # The accept cases carry the weight: flagging `describe.skipIf(!LIVE)` would mean nine
        # false positives on day one, and a check that cries wolf gets disabled.
        run: pnpm test:skips

      - name: Check - no test is skipped unconditionally without a declared reason
        # A suite reporting "325 passed | 10 skipped" is green, and a skipped test is
        # indistinguishable from a passing one at the summary. One of those ten guarded an FD
        # leak, carried the note "un-skip as part of the route fix", and stayed off for days
        # after that fix landed. It passes.
        run: pnpm skips

      - name: Check - the severability matrix derives 8 jobs from rungs.json
        run: pnpm matrix

      # This gate must satisfy its own rule, so its proof sits in the same workflow it does.
      # A gate demanding "every checker is observed to fail" that shipped unobserved would be
      # its own counterexample — and it would be the fourth checker to do that.
      - name: Self-test the build-order gate (proves it can fail — do not remove)
        # PKG-01 was a ✓ resting on a declaration nobody checked. This proves the
        # checker refuses an unordered graph; without it the checker below could
        # silently stop comparing and still report success.
        run: pnpm test:build-order

      - name: Build order is enforced, not merely declared
        # Compares each package.json's own workspace dependencies against turbo's
        # RESOLVED task graph. Neither side reads turbo.json, so `dependsOn` being
        # present cannot satisfy it.
        run: pnpm build-order

      - name: Self-test the README Quick Start gate (proves it can fail — do not remove)
        # #478: six packages carried a `readme-quickstart.test.*` whose header
        # called it "the executable form of the README" while reading no README
        # at all. This proves the replacement refuses an empty extraction, a
        # renamed heading and an unclosed fence, and reports a symbol the
        # package does not export — the defects are planted, not described.
        run: pnpm test:readme-quickstart

      - name: Every README Quick Start names symbols the package exports
        # Reads the PUBLISHED README, extracts the Quick Start fences and checks
        # them against the .d.ts the package's own manifest publishes. Runs
        # after Build because the published surface is a build artifact; without
        # it the checker refuses rather than reporting every symbol present.
        run: pnpm readme-quickstart

      - name: Self-test the single-instance gate (proves it can fail — do not remove)
        # RCT-04's second half. The first half — react/zod declared as peers —
        # was already true and already ticked; the CONSEQUENCE it exists to
        # produce was not holding. packages/mcp pinned `zod: ^3.23.0` as a hard
        # dependency, so the tree carried zod 3.25.76 AND 4.4.3, and nothing
        # anywhere said so. Two zod copies means a schema built by one is not
        # `instanceof` the other's classes.
        run: pnpm test:single-instance

      - name: No duplicate module instances (RCT-04)
        run: pnpm single-instance

      - name: Self-test the CI-completion reader (proves it can fail — do not remove)
        # #115. A cancelled run reports NO VERDICT, but the board renders it as a
        # grey icon that reads closer to "fine" than to "unknown". That is how a
        # 15% failure rate on E2E — Mocked stayed invisible: 47% of main's runs
        # were cancelled, so main completed only 7 runs in the sampled window and
        # one real failure read as noise.
        #
        # The MEASUREMENT itself runs on a schedule (ci-measurement.yml), not
        # here — it is about main's history, and failing a PR for that would
        # blame the wrong change. What runs here is the reader's own selftest,
        # which is deterministic and needs no network.
        run: pnpm test:ci-completion

      - name: Check - the check runner can fail, and says so out loud
        # Watched emitting a real ::error:: for a real failure, not asserted to contain the
        # template. A runner that swallowed a failure into a printed table would look
        # identical from outside and is the regression consolidating 55 steps could introduce.
        run: pnpm test:checks

      - name: Remove any shallow boundary before the revert check reads history
        # MEASURED, AND NOT WHERE ANYONE WOULD LOOK FOR IT. In run 33378216627 this same block
        # ran immediately after checkout and reported `No shallow boundary: the clone is
        # complete` at 09:35:17. Three and a half minutes later, at 09:38:59,
        # assert-no-undeclared-reverts found one:
        #
        #     CUT at 1 boundary commit(s) ... Boundary: 9fe5d569  (main's tip, i.e. THE BASE)
        #     .github/workflows/ci.yml
        #     scripts/checks.json
        #
        # THE WRITER IS NOW IDENTIFIED, and it is PLAYWRIGHT — run by another check's proof,
        # four steps earlier in this same job. `check-github-reporter.selftest.mjs` runs a
        # throwaway spec under a config inside the repo; Playwright's gitCommitInfo plugin
        # defaults `captureGitInfo.diff` to ON when it detects CI, and that path runs
        #
        #     git fetch origin <pull_request.base.sha> --depth=1 --no-auto-maintenance ...
        #
        # in the workspace repository. `--depth=1` writes `$GIT_DIR/shallow` holding exactly
        # that commit — 41 bytes, one sha, and that sha is the base this checker compares
        # against. Reproduced outside CI by setting GITHUB_ACTIONS and GITHUB_EVENT_PATH, and
        # A/B'd: with `captureGitInfo` off the file never appears, with it on it returns at 41
        # bytes. That proof is fixed at source, so this step should now find nothing.
        #
        # IT STAYS ANYWAY, because the class outlives the instance: any tool this job runs can
        # depth-fetch in a repository it does not own, and the failure it causes is a check
        # silently reading a truncated past. Repairing ADJACENT TO THE CONSUMER is what makes
        # that survivable — an earlier position measured the clone as complete twice while it
        # was about to stop being so.
        #
        # WHY THE BOUNDARY IS FATAL RATHER THAN INCONVENIENT: it is main's tip, which is exactly
        # what the checker resolves as its base on a pull_request. git grafts a boundary
        # parentless, so a walk from the base sees ONE commit and every file in its tree reads
        # as "added there" — a revert of anything older is invisible. The two files named are
        # the two that predate the branch; the other three the branch ADDS, which have no past
        # at the base to be cut. 2 of 5, exactly.
        #
        # THIS REPAIRS THE ENVIRONMENT; IT DOES NOT RELAX THE CHECK. If deepening does not work
        # the file survives, the checker refuses as before and names the files whose past it
        # could not read — so this warns rather than failing, and the verdict stays with the
        # check that can say what was missing. severability.yml deepens the same way for the
        # same reason, though it starts from the default fetch-depth rather than from 0.
        run: |
          set -euo pipefail
          shallow="$(git rev-parse --git-dir)/shallow"
          echo "is-shallow-repository=$(git rev-parse --is-shallow-repository)"
          if [ ! -f "$shallow" ]; then
            echo "No shallow boundary: the clone is complete, nothing to deepen."
            exit 0
          fi
          echo "Shallow boundary present before deepening ($(wc -l < "$shallow") entry(ies)):"
          cat "$shallow"
          deepened=0
          git fetch --no-tags --unshallow origin && deepened=1
          if [ "$deepened" -eq 0 ]; then
            git fetch --no-tags --deepen=500 origin && deepened=1
          fi
          if [ -f "$shallow" ]; then
            echo "::warning title=shallow boundary survived::deepened=$deepened and the boundary is still there:"
            cat "$shallow"
            echo "assert-no-undeclared-reverts will refuse and name the files whose past it could not read."
            exit 0
          fi
          echo "Boundary removed (deepened=$deepened, is-shallow-repository=$(git rev-parse --is-shallow-repository))."

      - name: Check - the declared checks, each with its proof
        # ONE STEP FOR SIX CHECKERS, declared in scripts/checks.json and executed by
        # run-checks.mjs. ci.yml had grown to 55 hand-written `pnpm` steps in a single job;
        # three PRs in one hour collided in this region. The list is not a description of what
        # runs — the runner iterates it and this step invokes the runner, so an entry IS an
        # execution.
        #
        # Per-checker reasoning lives in each checker's own header, where it already did; the
        # comments here were copies of it. Proof-before-checker is now a property of the
        # runner rather than six `&&` chains that the seventh could omit.
        #
        # THE RUN RECORD IS WHY THIS IS WORTH DOING. `.checks-run.json` says what actually
        # executed, and the pairing gate below reads it instead of inferring from this file's
        # text. A YAML parse can only establish that a workflow MENTIONS a script; it cannot
        # tell that apart from the step having run.
        #
        # Failures arrive as ::error:: annotations naming the checker, which is more than the
        # step name it replaces — and is queryable over GraphQL.
        #
        # PROTECTION_READ_TOKEN IS PASSED IN AND DOES NOT YET EXIST, deliberately (#404). One
        # declared check reads branch protection, which needs repository Administration: READ.
        # GITHUB_TOKEN cannot carry that in any channel — `administration` is not a key a
        # `permissions:` block accepts — so it needs a PAT or App token, and minting a
        # credential is a human's action.
        #
        # Until it exists, `${{ secrets.PROTECTION_READ_TOKEN }}` interpolates to an empty
        # string, the runner derives the `repo-settings` channel as unsatisfiable, and that
        # check is recorded as SKIPPED with its reason, announced as a ::warning::, and
        # excluded from the executed count. A visible hole, not a pass and not a red. The
        # moment the secret is created this starts measuring, with no second pull request.
        #
        # A fork PR reaches no repository secret, so it takes the same path — which is the
        # point: never red for a permission a contributor can never hold.
        env:
          PROTECTION_READ_TOKEN: ${{ secrets.PROTECTION_READ_TOKEN }}
        run: pnpm checks

      - name: Self-test the checker/proof pairing gate (it must obey itself)
        run: pnpm test:pairing

      - name: Check - every checker CI runs has a proof, and CI runs the proof
        run: pnpm pairing

      - name: Proof harness — mutation-proof.mjs emits every verdict it can emit
        # The shared harness the *.selftest.mjs family is converging on. Its own
        # proof runs here for the same reason theirs do: a harness that decides
        # whether other proofs are VOID had better have been observed deciding.
        run: pnpm test:mutation-proof

      - name: Self-test the workspace guard (proves it fires, and that it stays silent)
        # Both directions carry equal weight for this one. Its history is false
        # positives — a bare --filter matched docker's flag, a word-count reported
        # 135 hits, a 6-line window flagged the has-rung guard it exists to credit.
        # A checker that cries wolf gets deleted, which is worse than one that never
        # fires, so the spare cases are as load-bearing as the reject cases.
        run: pnpm test:workspaces

      - name: Check - no CI step or script invokes a workspace this tree lacks
        # A rung-1 fork would otherwise ship workflows running `pnpm --filter open-swe dev`
        # against an app it does not contain. Stated as a property that is true on main AND in
        # every fork — not as a grep for a rung's name, which counts prose.
        run: pnpm rungs:workspaces

      - name: Self-test the dist checker (proves it can fail — do not remove)
        run: bash scripts/assert-dist-clean.selftest.sh

      - name: Self-test the dev hold decision (proves BOTH directions — do not remove)
        # `pnpm dev` once started the backend container and destroyed it in the
        # same breath, because `wait` with no background jobs returns instantly
        # and the EXIT trap ran. Both directions are asserted: holding when
        # there is nothing to hold wastes a terminal; exiting when there ARE
        # background jobs kills the app and the agent.
        run: bash scripts/dev-hold.selftest.sh

      - name: Self-test the langfuse dev wiring (proves BOTH directions — do not remove)
        # The failure this guards is asymmetric: emitting the override
        # unconditionally would make every forker WITHOUT the fixture fail
        # closed, which is louder than the missing tracing it replaced. Both
        # directions are asserted, with `docker` stubbed, so no container runs.
        run: bash scripts/langfuse-wiring.selftest.sh

      - name: Check - @deepagents-nextjs/sveltekit has no React/Next.js in dist
        run: |
          bash scripts/assert-dist-clean.sh \
            --label "sveltekit ships no React/Next.js" \
            --forbid-module 'react|react-dom|next' \
            -- packages/sveltekit/dist/index.js packages/sveltekit/dist/index.mjs

      - name: Check - @deepagents-nextjs/remix handler has no @deepagents-nextjs/* cross-package imports in dist
        run: |
          bash scripts/assert-dist-clean.sh \
            --label "remix ships no @deepagents-nextjs/* cross-package imports" \
            --forbid-module '@deepagents-nextjs/react|@deepagents-nextjs/server' \
            -- packages/remix/dist/index.js packages/remix/dist/index.mjs

      - name: Check - @deepagents-nextjs/edge dist has no Node.js built-ins
        run: |
          bash scripts/assert-dist-clean.sh \
            --label "edge ships no Node.js built-ins" \
            --forbid-module 'stream|fs|http|https|path|os|process|util|events|buffer' \
            -- packages/edge/dist/index.js

      - name: Check - @deepagents-nextjs/edge dist has no @deepagents-nextjs/server import
        run: |
          bash scripts/assert-dist-clean.sh \
            --label "edge ships no @deepagents-nextjs/server" \
            --forbid-module '@deepagents-nextjs/server' \
            -- packages/edge/dist/index.js
  # THE PYTHON PLANE, ON THE UN-EJECTED TREE.
  #
  # A separate job because neither backend has a package.json: the `ci` job
  # above is pnpm-driven and would never execute a line of either one. Five
  # green ticks over a plane nothing ran is the shape severability.yml's own
  # header warns about.
  #
  # Two things run here, and they close two different holes.
  #
  #   ruff F821  — the counterpart to `pnpm typecheck`, on the tree as shipped.
  #                severability.yml runs it POST-EJECT, which is where the
  #                interesting failures are; this catches the plain ones before
  #                a fork is even attempted.
  #
  #   pytest     — the backend's own tests. THEY HAD NEVER RUN IN CI. Three
  #                test files carried a note saying so in prose, which is a
  #                comment where a job was needed: tests nothing executes look
  #                exactly like coverage, and read as coverage in review.
  python:
    name: Python plane — undefined names and backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.12"

      - name: Undefined names (ruff F821) — correctness only, never style
        # F821 alone is deliberate. A fork must not go red here over
        # formatting; this gate exists for the class where a name is
        # referenced and does not exist.
        run: |
          set -euo pipefail
          pipx run ruff check --select F821 --no-cache \
            apps/fastapi-backend apps/django-backend

      - name: FastAPI backend tests
        working-directory: apps/fastapi-backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # httpx IS load-bearing: fastapi's TestClient is built on it, and
          # tests/test_response_wire_format.py needs it to assert on a RESPONSE
          # rather than on a generator. It currently arrives transitively via
          # langfuse, so leaving it undeclared works right up until a pin moves.
          pip install pytest httpx
          # --strict-markers turns an UNREGISTERED marker into an error.
          # Without it, `@pytest.mark.asyncio` with no pytest-asyncio installed
          # does not fail — it skips the body and reports a PASS. Six tests
          # "passed" that way while landing #288, and the only reason it was
          # caught is that they also passed against the unfixed code.
          python -m pytest tests/ -q --strict-markers

      - name: The approval vocabulary we offer is one the parser accepts (#669)
        # HERE RATHER THAN scripts/checks.json, and the reason is the dependency.
        # This checker asks an INSTALLED langchain what `interrupt_on={t: True}`
        # expands to, so it can only run where the backend's requirements are
        # installed — which is this job and not the node one that iterates that
        # registry. Registering it there would exit 2 on every run.
        #
        # WHAT IT GUARDS. `requirements.txt` pins `langchain>=0.3.0`, a FLOOR, and
        # the decision vocabulary lives inside it: 1.2.11 expands True to three
        # decisions and 1.3.18 to four. Both satisfy the floor. So the set of
        # buttons the approval card offers can change under a compliant install
        # with nothing going red. The same file PINS deepagents and says why
        # (#10); the reasoning was applied to the dependency whose vocabulary
        # does not matter and not to the one whose does.
        #
        # IT FAILS IN ONE DIRECTION ONLY, DELIBERATELY. A widening — upstream
        # producing a decision our parser refuses — renders a button that breaks
        # the next request, and fails. A narrowing is reported and does NOT fail,
        # because the card renders only what the payload offers
        # (ApprovalPauseCard.tsx:90) and the authoring rung does not use the
        # middleware at all (langgraph.py:110). Failing on a narrowing would go
        # red on 1.2.11 - a safe install a developer here actually has - and a
        # red with an obvious one-line repair gets muted, taking the widening
        # case with it.
        #
        # The proof runs first and carries the load: today every 1.3.x install
        # agrees with the parser, so the checker is green on a UNIFORM grid and
        # neither direction has run. The selftest is where they run.
        working-directory: .
        run: |
          set -euo pipefail
          node scripts/assert-approval-vocabulary-agrees.selftest.mjs
          # An interpreter that cannot answer must REFUSE (exit 2), never pass -
          # so the path is named explicitly rather than discovered.
          node scripts/assert-approval-vocabulary-agrees.mjs --python "$(command -v python)"

      - name: Django backend tests
        # THE PLANE HAD NO TESTS AND NO WAY TO RUN ONE (#508). E2E-01 claims
        # django emits the DeepAgents SSE wire format via StreamingHttpResponse
        # and nothing proved it — which is also WHY check-run-axes-parity.mjs is
        # a source check: its header says "the django backend has no test
        # harness and pnpm cannot see it".
        #
        # Same shape as the FastAPI step above, deliberately: full requirements
        # so the import chain is the real one, and --strict-markers for the same
        # reason. No httpx here — django.test.AsyncClient needs no third-party
        # transport — and no pytest-asyncio, because the tests wrap asyncio.run()
        # in plain functions rather than relying on a marker that SKIPS AND
        # REPORTS PASS when the plugin is absent.
        working-directory: apps/django-backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          python -m pytest tests/ -q --strict-markers
