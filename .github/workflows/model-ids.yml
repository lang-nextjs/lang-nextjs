name: Model ids still resolve

# Do the model ids this repository OFFERS still exist at their provider? (#1174)
#
# `rungs/5-software-developer-agent/.../open-swe/models.ts` offers ids for selection and nothing
# checked that any of them still resolves. One of them is the sibling of the id that took main red
# in #1152 — a retired id fails as a 404 that the live-transport classifier stamps
# UPSTREAM_UNAVAILABLE, "not a defect in this repository", which is how that one stayed invisible.
#
# WHY A SCHEDULED JOB AND NOT A CHECK. It needs the network, so it cannot be an ordinary gate, and
# it is not a verdict about one tree: each provider is asked separately and answers separately.
# 0 holds / 1 violated / 2 could not ask, PER PROVIDER.
#
# IT RUNS WITH TWO OF THREE PROVIDERS UNASKABLE, DELIBERATELY. This repository holds no OpenAI or
# Google credential, so 13 of the 19 offered ids cannot be asked about today. The probe reports
# that count on every run rather than waiting for credentials: 6 checked is strictly more than the
# zero we had, and the unaskable number is what makes the gap a decision someone can take rather
# than a silence. If those credentials are added, nothing here changes but the counts.

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC — a retired id is a slow defect, not an urgent one
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the probe FILES what it finds; a scheduled run cannot red a pull request

jobs:
  provider-key-configured:
    name: Config — at least one provider catalogue can be asked
    runs-on: ubuntu-latest
    # THIS JOB OWNS ONE SUBJECT: does this repository hold any credential that can ask a provider
    # for its catalogue? It tracks — the answer is "anthropic only" here today, "none" in a fork,
    # and it flips the day someone sets a secret.
    #
    # IT EXISTS BECAUSE THE PROBE BELOW IS GATED ON IT, and a gated job that does not run is
    # SKIPPED, which GitHub scores NEUTRAL — green. Without this companion, a tree with no
    # credential would report a silently green workflow, which is the false green one layer up.
    #
    # WHY A COMPANION JOB AND NOT `if: secrets.X != ''`. The house rule, from e2e.yml: an `if:` on
    # the secret is a function of THE ANSWER and hides the verdict it dislikes. `needs:` on a
    # companion is a function of whether an answer is OBTAINABLE AT ALL — the instrument's reach.
    # This is the second kind.
    #
    # AND IT DOES NOT FAIL WHEN THE ANSWER IS "NONE". `.github/**` is shared, so this workflow
    # ships into every ejected fork, and a fork holds no secrets: failing here would put a weekly
    # red on every fork for a condition no forker can resolve — the job that structurally cannot
    # pass. It reports instead, and the probe is skipped rather than exiting 2 forever.
    outputs:
      configured: ${{ steps.ask.outputs.configured }}
    steps:
      - name: Which provider catalogues can be asked here
        id: ask
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set -euo pipefail
          # `if` rather than `[ ... ] && ...`: under `set -e` the AND-OR form is safe only because
          # a non-final command in the list is exempt, which is a rule a reader should not have to
          # know to be sure this job reports rather than fails.
          __have=""
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then __have="${__have} anthropic"; fi
          if [ -n "${OPENAI_API_KEY:-}" ]; then __have="${__have} openai"; fi
          if [ -n "${GOOGLE_API_KEY:-}" ]; then __have="${__have} google-genai"; fi
          if [ -z "${__have}" ]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "NO PROVIDER CREDENTIAL in this repository, so no catalogue can be asked and the"
            echo "probe below is skipped. That is the honest state of a fork, and of this repo for"
            echo "openai and google-genai. It is reported rather than failed: see this job's header."
          else
            echo "configured=true" >> "${GITHUB_OUTPUT}"
            echo "askable provider(s):${__have}"
            echo "the probe reports the ids it could NOT ask about, per provider, on every run."
          fi
          # Same reason as the probe's summary below: a green job's stdout is not a place anyone
          # looks, and this job's whole output is one fact about the tree.
          if [ -z "${__have}" ]; then
            echo "### Model ids: no provider credential here, so nothing was asked." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### Model ids: askable provider(s):${__have}" >> "${GITHUB_STEP_SUMMARY}"
          fi

  probe:
    name: Ask each provider's catalogue
    runs-on: ubuntu-latest
    needs: provider-key-configured
    if: needs.provider-key-configured.outputs.configured == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      # PROOF FIRST, then the probe — the same order the checks runner uses. A probe that reports
      # "everything resolves" is worth exactly as much as the evidence that it can say otherwise,
      # and this one needs no install: it is plain node plus fetch.
      - name: Self-test the probe (proves it can find a retired id — do not remove)
        run: node scripts/probe-model-ids.selftest.mjs

      - name: Ask each provider whether the ids we offer still exist
        id: probe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OPENAI_API_KEY and GOOGLE_API_KEY are deliberately absent: this repository holds
          # neither. The probe reports those providers as "could not ask" rather than passing
          # over them, and counts their ids as unaskable.
        run: |
          set -o pipefail
          node scripts/probe-model-ids.mjs 2>&1 | tee probe.txt
          # THE COUNT GOES WHERE SOMEONE READS IT (DEV1, reviewing). Exit 1 and exit 2 are loud —
          # they fail the step and file an issue. The exit-0 path is the one that happens ~52 times
          # a year, and its SUBJECT line was stdout of a green job, which is the blind spot this
          # probe exists to remove, one layer out. The summary is written on EVERY outcome.
          {
            echo "### Model ids"
            echo
            echo '```'
            sed -n '/^SUBJECT:/,$p' probe.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # A FINDING GOES TO AN ISSUE, because a scheduled run has no pull request to red. Updated
      # rather than duplicated: one open issue per finding, or a comment on the one that exists.
      - name: File or update the finding
        if: failure() && steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          __title="A model id we offer no longer resolves at its provider"
          __existing=$(gh issue list --state open --search "$__title in:title" --json number -q '.[0].number' || true)
          {
            echo "The scheduled model-id probe reported a finding."
            echo
            echo '```'
            cat probe.txt
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > body.md
          if [ -n "${__existing}" ]; then
            gh issue comment "${__existing}" -F body.md
          else
            gh issue create --title "${__title}" -F body.md
          fi
