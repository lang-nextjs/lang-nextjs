name: Benchmark

on:
  push:
    branches: [main, feat/ai-backend-matrix]
  pull_request:
    branches: [main, feat/ai-backend-matrix]
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Update baseline after successful run'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-regression:
    name: Benchmark Regression Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run benchmarks
        run: pnpm --filter @deepagents-nextjs/server bench --reporter=json > benchmark-results.json || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results.json
          retention-days: 30

      - name: Download baseline
        if: github.ref == 'refs/heads/main'
        id: download-baseline
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          name: benchmark-baseline
          path: .
        continue-on-error: true

      - name: Compare to baseline (main branch only)
        if: github.ref == 'refs/heads/main' && steps.download-baseline.outputs.found == 'true'
        run: |
          node .github/workflows/compare-benchmarks.js benchmark-results.json benchmark-baseline.json

      - name: Store baseline (main branch on success)
        if: github.ref == 'refs/heads/main' && github.event.inputs.update_baseline == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-baseline
          path: benchmark-results.json
          retention-days: 365