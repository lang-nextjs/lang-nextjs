name: Cross-Version Matrix

# Verifies the packages build + test cleanly across the supported
# Node, Next.js, and React version matrix. Catches version-specific
# breakage (peer-dep mismatches, API surface changes) before users do.
#
# Runs on PRs that touch packages/ or apps/ source, and weekly to catch
# newly released minor versions that may have regressed compatibility.

on:
  # The push PATHS filter is gone too — `branches:` below stays, deliberately.
  #
  # Removing the paths half is a judgement rather than a rule: main is what every
  # branch is measured against, and the concurrency block below already treats a
  # main run as something that must not be cancelled. Verifying it on every merge
  # for 2-10 minutes of parallel matrix is the cheaper side of that bargain.
  #
  # `branches:` answers a different question — WHICH BRANCHES DESERVE A BUILD —
  # and every branch building on every push is waste, not coverage.
  # check-pr-triggers.mjs deliberately does NOT enforce either push half: a push
  # that skips is not a review that silently reported nothing.
  push:
    branches: [main, feat/ai-backend-matrix]
  # NO `branches:` FILTER HERE, DELIBERATELY.
  #
  # `pull_request.branches` filters on the BASE branch. While this read
  # `[main, feat/ai-backend-matrix]`, a pull request based on anything else
  # matched no trigger and ran NOTHING — and a PR page with no checks section
  # reads as fine to anyone scrolling past. Not a red we ignored, and not a
  # green over nothing: no checks at all.
  #
  # That is how #130 was merged with ZERO CI, gated on a named check that did
  # not exist. Every stacked PR had the same hole, which is most of them —
  # this team works in stacks routinely.
  #
  # An allowlist of base branches cannot survive that pattern: it needs editing
  # in six files every time someone opens a stack, and it is stale the moment
  # they do. So the filter is gone rather than widened. `push` keeps its filter;
  # that one is about which branches deserve a build, not about which pull
  # requests deserve review.
  # NO `paths:` FILTER EITHER, FOR THE SAME REASON ONE FIELD OVER (#380).
  #
  # It read packages/**, apps/**, pnpm-lock.yaml and this file. Those four miss
  # the root files that configure the build they gate: turbo.json is the build
  # graph, pnpm-workspace.yaml decides which packages exist at all, scripts/**
  # is the tooling every job invokes, and root package.json carries the scripts,
  # packageManager and engines that decide what actually runs.
  #
  # NOT the `pnpm.overrides` example this issue was filed with — that one does
  # not hold, and it was checked rather than repeated. pnpm records the override
  # map IN pnpm-lock.yaml, so editing overrides puts the lockfile in the diff and
  # the OLD filter matched it. Adding an override locally and running
  # `pnpm install --lockfile-only` moves the lockfile by exactly one line.
  #
  # The real uncovered edit is duller and far more common: a root package.json
  # SCRIPTS change, which touches no dependency and moves no lockfile.
  #
  # NOT HYPOTHETICAL, AND NOT RARE. Of the last 25 merged PRs, eight matched
  # none of the four globs while touching root package.json or scripts/ —
  # #381, #369, #366 and #344 edited root package.json and ran ZERO
  # cross-version contexts each. Every one of those four was a `scripts:`
  # addition wiring a new checker into CI. #372's Next 15.5 type error was
  # caught only because that PR happened to also touch apps/.
  #
  # WIDENED, NOT REMOVED, WAS THE OBVIOUS FIX AND IS THE WRONG ONE. The
  # argument is already written above for `branches:`: an allowlist that has to
  # be re-derived every time the build gains an input is stale exactly when it
  # matters, and its failure mode is silence — no trigger, no checks section, a
  # PR page that reads as fine. Deriving the set from the build inputs moves the
  # same under-enumeration one level up and gives it a checker's authority: it
  # would report PASS about a set someone chose.
  #
  # Removing it inverts the failure mode. The cost of being wrong is now a job
  # that runs when it need not — visible, and 2-10 minutes of parallel matrix.
  # The cost before was a verification that did not happen and said nothing.
  #
  # AND IT IS WHAT MAKES THESE SEVEN REQUIRABLE. A required check that can be
  # skipped blocks its PR permanently, so Node 20/22/24, Next ^15.5/^16 and
  # React ^18.3/^19 are all excluded from branch protection today. With no path
  # filter they always report, so they can be required — which is the point:
  # a filter becomes a guarantee.
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # Monday 07:00 UTC

concurrency:
  group: cross-version-${{ github.ref }}
  # CANCEL ON BRANCHES, NEVER ON MAIN (#115). Superseding a PR's in-flight run
  # is right: the newer commit is the one anyone cares about, and the old run's
  # verdict is about code nobody will merge.
  #
  # ON MAIN IT INVERTS THE MEANING OF THE BOARD. A cancelled run reports NO
  # VERDICT — not a weak pass, not a partial one, the absence of a measurement —
  # and nothing in how the board is read distinguishes "passed" from "never
  # finished". With this set to true, 47% of main's runs were cancelled, so main
  # was measured half as often as it appeared to be, and a real failure sat
  # unnoticed among grey icons. Activity suppressed verification, which is
  # exactly backwards: the busier main got, the less it was actually checked.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  node-matrix:
    name: Node ${{ matrix.node }} — full build + test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Assert Node ${{ matrix.node }} is what actually runs
        # Without this the cell reports a verdict about a Node version it may
        # never have run (a setup-node miss silently falls back to the runner
        # default). See .github/scripts/assert-resolved-version.sh for the
        # general form of this argument.
        run: |
          set -euo pipefail
          actual="$(node -p 'process.versions.node')"
          if [ "${actual%%.*}" != "${{ matrix.node }}" ]; then
            echo "ERROR: cell claims Node ${{ matrix.node }} but node is $actual"
            exit 1
          fi
          echo "  ok  node@$actual"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

  nextjs-matrix:
    # NAME ACCURACY: this job was called "example app builds" while its only
    # build step is `pnpm build`, which walks the WHOLE turbo graph — every
    # workspace package plus BOTH Next apps. apps/example is not even the first
    # app to fail; open-swe is. Anyone reading the old name would not know
    # open-swe was in scope, and anyone debugging open-swe would not think to
    # look in a job named for example.
    #
    # Fixed by correcting the NAME rather than narrowing the build: compiling
    # the full graph under an older Next is more coverage, not less. It just has
    # to say so.
    name: Next.js ${{ matrix.next }} — full workspace build (both Next apps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        next: ["^15.5.0", "^16.0.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pin Next.js ${{ matrix.next }} across server package + both apps
        # MUST also pin Next.js in @deepagents-nextjs/server (the workspace
        # package the example imports). Otherwise the server's compiled
        # types reference Next 15's NextRequest while the example app sees
        # Next 16's NextRequest, and tsc reports the union mismatch as a
        # route-handler signature error — caught by the e672db4 run.
        run: |
          pnpm --filter @deepagents-nextjs/server add -D next@${{ matrix.next }}
          pnpm --filter example add next@${{ matrix.next }}
          # open-swe is rung-4-owned; a lower fork has no such workspace to pin.
          if ! __rung=$(node scripts/has-rung.mjs open-swe); then
            echo "FAIL: cannot determine whether the open-swe rung is present" >&2; exit 1
          fi
          if [ "$__rung" = "yes" ]; then
            pnpm --filter open-swe add next@${{ matrix.next }}
          fi

      - name: Self-test the version checker (proves it can fail — do not remove)
        run: bash .github/scripts/assert-resolved-version.selftest.sh

      - name: Assert Next ${{ matrix.next }} actually resolved everywhere it was pinned
        # The pin step above can appear to succeed while resolving elsewhere (a
        # root pnpm override, a spec matching nothing). Building without checking
        # would report a verdict about a version this cell never ran.
        run: |
          # The target list is rung-aware: apps/open-swe is rung-4-owned and a lower fork has no
          # such path to assert a resolved version in.
          TARGETS="packages/server apps/example"
          if ! __rung=$(node scripts/has-rung.mjs open-swe); then
            echo "FAIL: cannot determine whether the open-swe rung is present" >&2; exit 1
          fi
          if [ "$__rung" = "yes" ]; then
            TARGETS="$TARGETS apps/open-swe"
          fi
          # shellcheck disable=SC2086
          bash .github/scripts/assert-resolved-version.sh '${{ matrix.next }}' next $TARGETS

      - name: Build the full workspace graph (packages + both Next apps)
        # The apps import @deepagents-nextjs/* workspace packages; those
        # must be built first or the example/open-swe build fails with
        # "Module not found: Can't resolve '@deepagents-nextjs/server'".
        run: pnpm build

  react-matrix:
    # NAME ACCURACY: this job was called "react package + example app" and no
    # step builds the example app — the only build and test are both
    # `--filter @deepagents-nextjs/react`. That name claimed app-level React
    # coverage this workflow has never had, and it claimed it while GREEN,
    # which is the worse direction to be wrong in.
    #
    # Renamed to what it does. Adding real example-app coverage under an old
    # React is worth doing, but it is a scope increase with its own failures to
    # triage, so it is left as a follow-up rather than smuggled in behind a
    # rename.
    name: React ${{ matrix.react }} — react package build + test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["^18.3.0", "^19.0.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pin React ${{ matrix.react }}
        run: |
          pnpm --recursive add react@${{ matrix.react }} react-dom@${{ matrix.react }}
        continue-on-error: true # peer-dep mismatch is expected for some combos

      - name: Self-test the version checker (proves it can fail — do not remove)
        run: bash .github/scripts/assert-resolved-version.selftest.sh

      - name: Assert React ${{ matrix.react }} actually resolved
        # This matters most HERE: the pin step above is `continue-on-error`, so a
        # failed install is swallowed and the job would carry on testing whatever
        # React was already present while still reporting the matrix version.
        run: |
          bash .github/scripts/assert-resolved-version.sh \
            '${{ matrix.react }}' react packages/react
          bash .github/scripts/assert-resolved-version.sh \
            '${{ matrix.react }}' react-dom packages/react

      - name: Build react package
        run: pnpm --filter @deepagents-nextjs/react build

      - name: Test react package
        run: pnpm --filter @deepagents-nextjs/react test
