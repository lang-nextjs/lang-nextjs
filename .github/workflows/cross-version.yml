name: Cross-Version Matrix

# Verifies the packages build + test cleanly across the supported
# Node, Next.js, and React version matrix. Catches version-specific
# breakage (peer-dep mismatches, API surface changes) before users do.
#
# Runs on PRs that touch packages/ or apps/ source, and weekly to catch
# newly released minor versions that may have regressed compatibility.

on:
  push:
    branches: [main, feat/ai-backend-matrix]
    paths:
      - "packages/**"
      - "apps/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/cross-version.yml"
  pull_request:
    branches: [main, feat/ai-backend-matrix]
    paths:
      - "packages/**"
      - "apps/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/cross-version.yml"
  schedule:
    - cron: "0 7 * * 1" # Monday 07:00 UTC

concurrency:
  group: cross-version-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-matrix:
    name: Node ${{ matrix.node }} — full build + test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

  nextjs-matrix:
    name: Next.js ${{ matrix.next }} — example app builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        next: ["^15.5.0", "^16.0.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pin Next.js ${{ matrix.next }} across server package + both apps
        # MUST also pin Next.js in @deepagents-nextjs/server (the workspace
        # package the example imports). Otherwise the server's compiled
        # types reference Next 15's NextRequest while the example app sees
        # Next 16's NextRequest, and tsc reports the union mismatch as a
        # route-handler signature error — caught by the e672db4 run.
        run: |
          pnpm --filter @deepagents-nextjs/server add -D next@${{ matrix.next }}
          pnpm --filter example add next@${{ matrix.next }}
          pnpm --filter open-swe add next@${{ matrix.next }}

      - name: Build workspace packages first (turbo dependency graph)
        # The apps import @deepagents-nextjs/* workspace packages; those
        # must be built first or the example/open-swe build fails with
        # "Module not found: Can't resolve '@deepagents-nextjs/server'".
        run: pnpm build

  react-matrix:
    name: React ${{ matrix.react }} — react package + example app
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["^18.3.0", "^19.0.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pin React ${{ matrix.react }}
        run: |
          pnpm --recursive add react@${{ matrix.react }} react-dom@${{ matrix.react }}
        continue-on-error: true # peer-dep mismatch is expected for some combos

      - name: Build react package
        run: pnpm --filter @deepagents-nextjs/react build

      - name: Test react package
        run: pnpm --filter @deepagents-nextjs/react test
