name: Smoke Test

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to test (django, fastapi, open-swe, all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - django
          - fastapi
          - open-swe

env:
  DJANGO_HEALTH_URL: http://localhost:8002/health/
  FASTAPI_HEALTH_URL: http://localhost:8001/health
  OPENSWE_HEALTH_URL: http://localhost:3001

jobs:
  smoke-test-django:
    name: Smoke Test — Django Backend
    runs-on: ubuntu-latest
    if: inputs.service == 'all' || inputs.service == 'django'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Wait for Django backend
        # Was `uses: jwait polymorphic/wait-for-it@v1` — not a valid action
        # reference (it contains a space), and neither jwait/wait-for-it nor
        # polymorphic/wait-for-it exists. This workflow is dispatch-only, so
        # it had never run and the breakage stayed hidden. Waiting on a port
        # is three lines of bash; a third-party action here would add a
        # supply-chain dependency for no benefit.
        run: |
          for i in $(seq 1 60); do
            if nc -z localhost 8002; then echo "django up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::localhost:8002 (django) not reachable after 60s"
          exit 1

      - name: Run smoke checks
        run: |
          echo "=== Django Health Check ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8002/health/)
          if [ "$STATUS" -ne 200 ]; then
            echo "FAIL: health endpoint returned $STATUS"
            exit 1
          fi
          echo "PASS: health endpoint returned 200"

          echo "=== Django API Route Check ==="
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8002/api/chat/stream/)
          if [ "$API_STATUS" -ge 500 ]; then
            echo "FAIL: API route returned $API_STATUS"
            exit 1
          fi
          echo "PASS: API route returned $API_STATUS"

          echo "=== Django JSON Response Check ==="
          RESPONSE=$(curl -s http://localhost:8002/health/)
          if ! echo "$RESPONSE" | python3 -c "import sys, json; json.load(sys.stdin)" 2>/dev/null; then
            echo "FAIL: health endpoint did not return valid JSON"
            exit 1
          fi
          echo "PASS: health endpoint returned valid JSON"

          echo "=== All Django smoke checks passed ==="

  smoke-test-fastapi:
    name: Smoke Test — FastAPI Backend
    runs-on: ubuntu-latest
    if: inputs.service == 'all' || inputs.service == 'fastapi'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Wait for FastAPI backend
        # See the django job above: the action this replaced does not exist.
        run: |
          for i in $(seq 1 60); do
            if nc -z localhost 8001; then echo "fastapi up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::localhost:8001 (fastapi) not reachable after 60s"
          exit 1

      - name: Run smoke checks
        run: |
          echo "=== FastAPI Health Check ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health)
          if [ "$STATUS" -ne 200 ]; then
            echo "FAIL: health endpoint returned $STATUS"
            exit 1
          fi
          echo "PASS: health endpoint returned 200"

          echo "=== FastAPI API Route Check ==="
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/api/chat/stream/)
          if [ "$API_STATUS" -ge 500 ]; then
            echo "FAIL: API route returned $API_STATUS"
            exit 1
          fi
          echo "PASS: API route returned $API_STATUS"

          echo "=== FastAPI JSON Response Check ==="
          RESPONSE=$(curl -s http://localhost:8001/health)
          if ! echo "$RESPONSE" | python3 -c "import sys, json; json.load(sys.stdin)" 2>/dev/null; then
            echo "FAIL: health endpoint did not return valid JSON"
            exit 1
          fi
          echo "PASS: health endpoint returned valid JSON"

          echo "=== All FastAPI smoke checks passed ==="

  smoke-test-openswe:
    name: Smoke Test — open-swe Dashboard
    runs-on: ubuntu-latest
    if: inputs.service == 'all' || inputs.service == 'open-swe'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Wait for open-swe dashboard
        # See the django job above: the action this replaced does not exist.
        run: |
          for i in $(seq 1 60); do
            if nc -z localhost 3001; then echo "open-swe up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::localhost:3001 (open-swe) not reachable after 60s"
          exit 1

      - name: Run smoke checks
        run: |
          echo "=== open-swe Root Page Check ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/)
          if [ "$STATUS" -ge 500 ]; then
            echo "FAIL: root page returned $STATUS"
            exit 1
          fi
          echo "PASS: root page returned $STATUS"

          echo "=== open-swe API Runs Check ==="
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/open-swe/runs)
          if [ "$API_STATUS" -ge 500 ]; then
            echo "FAIL: API runs route returned $API_STATUS"
            exit 1
          fi
          echo "PASS: API runs route returned $API_STATUS"

          echo "=== open-swe HTML Error Check ==="
          BODY=$(curl -s http://localhost:3001/)
          if echo "$BODY" | grep -qiE '(500|502|503|error|internal server error)' && [ "$STATUS" -ne 200 ]; then
            echo "FAIL: root page contains error indicators"
            exit 1
          fi
          echo "PASS: no error indicators found"

          echo "=== All open-swe smoke checks passed ==="

  smoke-test-all:
    name: Smoke Test — Summary
    runs-on: ubuntu-latest
    needs: [smoke-test-django, smoke-test-fastapi, smoke-test-openswe]
    if: always()
    steps:
      - name: Set result summary
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Django | ${{ needs.smoke-test-django.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| FastAPI | ${{ needs.smoke-test-fastapi.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| open-swe | ${{ needs.smoke-test-openswe.result }} |" >> $GITHUB_STEP_SUMMARY
          if needs.smoke-test-django.outputs.result == 'failure' || \
             needs.smoke-test-fastapi.outputs.result == 'failure' || \
             needs.smoke-test-openswe.outputs.result == 'failure'; then
            echo ""
            echo "One or more smoke tests failed. Deployment should rollback."
            exit 1
          fi