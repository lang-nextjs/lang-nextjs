name: Performance

# Core Web Vitals + accessibility budget on the example app.
#
# This workflow used to carry a second job, `bundle-size`, running
# `size-limit` over `.size-limit.json`. Both were removed in #15: size-limit
# budgets gzipped *published tarball* weight, and all seven packages are
# `private: true` with no publish path (the OIDC publish workflow went in #20).
# A budget on a tarball nobody ships is not a gate, it is a green square.
#
# The lighthouse job below was deliberately KEPT. It does not measure package
# weight — it asserts Core Web Vitals and an accessibility floor
# (`categories:accessibility` >= 0.9, hard error) on the example app, which is
# a real Next.js app forkers run. That budget is live regardless of publishing;
# see #24 / PR #33, which fixed a WCAG AA nav contrast bug this class of check
# is meant to catch.

on:
  push:
    branches: [main, feat/ai-backend-matrix]
  pull_request:
    branches: [main, feat/ai-backend-matrix]

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Core Web Vitals — lighthouse-ci on example app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install lighthouse-ci
        run: npm install -g @lhci/cli

      - name: Build all packages + example app
        # `pnpm --filter example build` alone won't first build the
        # workspace packages (@deepagents-nextjs/server, /react, etc.)
        # that the example imports. Use the top-level `pnpm build`
        # so turbo resolves the dependency graph and builds packages
        # before the example.
        run: pnpm build

      # The server is started HERE rather than by lhci's startServerCommand, so
      # that the route preflight can run between "server is up" and "score the
      # pages". That ordering is the point: a budgeted route that 404s has to
      # fail as OUR assertion, naming the route and the role it was filling.
      # Before this, /open-swe had been dead since #19 and the job failed every
      # run with Lighthouse's ERRORED_DOCUMENT_REQUEST — Lighthouse falling
      # over, not us checking, and named after Lighthouse's plumbing.
      #
      # `pnpm start &` discards the server's exit code (same known limitation
      # e2e.yml documents), but unlike a bare `sleep`, the preflight below
      # waits for the server with a 60s deadline and fails HERE with a clear
      # message if it never answers — so a dead server is diagnosed at the step
      # that started it.
      - name: Start example app and assert every budgeted route resolves
        run: |
          pnpm --filter example start &
          node scripts/budgeted-routes.mjs --assert-live http://localhost:3000

      - name: Run lighthouse-ci against example
        run: lhci autorun --config=./lighthouserc.js
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
