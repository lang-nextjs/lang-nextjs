name: Mutation Testing

# Stryker mutation testing — verifies tests detect real behavioral
# changes, not just that lines were executed. Runs weekly because
# Stryker takes 10-30+ minutes per package; running on every PR would
# be prohibitive.
#
# Per-package thresholds defined in {package}/stryker.config.mjs. A
# package falling below its `break` threshold fails the workflow.
#
# Scoped to `server` only (#15). packages/server/stryker.config.mjs is the
# ONLY stryker config in the repo — `edge` and `react` had no config file, so
# their matrix legs failed at `stryker run stryker.config.mjs` every week on a
# missing file, not on a mutation score. Add a stryker.config.mjs to a package
# before adding it back to the matrix and to the dispatch choices below.

on:
  schedule:
    - cron: "0 5 * * 0" # Sunday 05:00 UTC
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to mutate (only `server` has a stryker config)"
        required: false
        default: "server"
        type: choice
        options:
          - server

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker — @deepagents-nextjs/${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [server]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # THE SUITE MUST PASS BEFORE IT IS MUTATED, and this step is what says so.
      #
      # Stryker's dry run cannot report a test file that fails BEFORE its tests run.
      # `validateResultCompleted` filters the run result for FAILED TESTS, and a file
      # that throws at module scope registers none, so there is nothing to filter; a
      # `beforeAll` that throws registers them and leaves them Skipped, which is also
      # not a failure. Both were measured at 9.6.1 (#1024):
      #
      #     arm            plain vitest            stryker dry run
      #     module scope   exit 1                  exit 0, "Ran 698 tests"
      #     beforeAll      exit 1, 15 skipped      exit 0, "Ran 713 tests"  <- 713 clean
      #
      # So the gate could report a mutation score with a whole file absent. A COUNT
      # comparison does not fix this: the second arm leaves the count untouched, so it
      # would close half the hole while reading as though it closed all of it — which
      # is the defect itself, rebuilt as its own remedy. A plain run exits 1 for both.
      #
      # It is `pnpm test` rather than a hardcoded `vitest run` so the precondition is
      # the package's OWN definition of its tests; spelling the command out here would
      # be a second definition that can drift from the one contributors use.
      #
      # AND THE STEP IS NAMED FOR WHAT IT EXECUTES, NOT FOR WHAT WE CONCLUDE FROM IT.
      # "the tests ran" is an INFERENCE from "the test script passed"; naming the step
      # for the inference makes every future failure of that script -- a coverage
      # threshold, a lint bolted on -- arrive under a label that claims more than the
      # step checked. Naming it for the script keeps the label true whatever the script
      # becomes, and vitest's own output is what separates "failed to RUN" from "failed
      # to PASS" for the reader. Same discipline as the rest of this file: report the
      # observation, not the conclusion drawn from it.
      #
      # Three seconds against a 10-30 minute Stryker run.
      - name: The package's own test script must pass before mutation
        working-directory: packages/${{ matrix.pkg }}
        run: pnpm test

      # NO `pnpm add -D @stryker-mutator/...` STEP. There was one, and it pinned
      # `^10` while packages/server/package.json declares `^9.6.1` and the lockfile
      # resolves 9.6.1 — so the gate measured a DIFFERENT MAJOR VERSION from the one
      # this repository ships, and a score here said nothing about the tool a
      # contributor runs (#1021). It also wrote package.json and the lockfile after
      # `--frozen-lockfile` had already been honoured, discarding the guarantee the
      # step above exists to give. Stryker is a declared devDependency; `pnpm install`
      # is what installs it.
      - name: Run Stryker
        working-directory: packages/${{ matrix.pkg }}
        run: pnpm exec stryker run stryker.config.mjs

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stryker-report-${{ matrix.pkg }}
          path: packages/${{ matrix.pkg }}/reports/mutation/
          retention-days: 30
