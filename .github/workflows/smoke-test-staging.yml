name: Smoke Test — Staging

# Manual trigger only. PR auto-run was disabled after we discovered the
# workflow was never validated to work (PR #50) and the required Vercel
# secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) aren't
# provisioned. Re-enable `pull_request: branches: [main]` once secrets
# land in repo settings and a manual run confirms the deploy succeeds.
on:
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy to Vercel Preview
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - id: deploy
        name: Deploy to Vercel (preview)
        working-directory: apps/open-swe
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Vercel secrets not configured — set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID in repo settings before running this workflow."
            exit 1
          fi
          url=$(npx vercel deploy --token="$VERCEL_TOKEN" --yes --environment=preview)
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

  smoke-test-staging:
    name: Smoke Test — Vercel Preview
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    env:
      BASE_URL: ${{ needs.deploy-staging.outputs.preview_url }}
    steps:
      # Readiness gate — formalizes promotion as health-gated. Asserts the
      # Phase 18 readiness probe (/api/ready, backed by createReadinessProbe) returns
      # 200 before the rollout is considered promotable. A 503 (draining) or any
      # non-200 fails the gate. Skips cleanly when BASE_URL is empty, consistent
      # with the manual-only, unprovisioned-secrets posture above.
      # See docs/DEPLOYMENT-RUNBOOK.md "Health-Gated Rollout".
      - name: Readiness gate (/api/ready 200)
        run: |
          echo "=== open-swe Readiness Gate ==="
          if [ -z "$BASE_URL" ]; then
            echo "SKIP: BASE_URL is empty (Vercel secrets not provisioned) — readiness gate skipped."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/api/ready")
          if [ "$STATUS" -ne 200 ]; then
            echo "FAIL: readiness gate /api/ready returned $STATUS (expected 200 — non-200/503 blocks promotion)"
            exit 1
          fi
          echo "PASS: readiness gate /api/ready returned 200"

      - name: Health check (200)
        run: |
          echo "=== open-swe Health Check ==="
          if [ -z "$BASE_URL" ]; then
            echo "SKIP: BASE_URL is empty (Vercel secrets not provisioned) — health check skipped."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/api/health")
          if [ "$STATUS" -ne 200 ]; then
            echo "FAIL: /api/health returned $STATUS (expected 200)"
            exit 1
          fi
          echo "PASS: /api/health returned 200"

      - name: Health check (valid JSON)
        run: |
          echo "=== open-swe JSON Response Check ==="
          RESPONSE=$(curl -s "$BASE_URL/api/health")
          if ! echo "$RESPONSE" | python3 -c "import sys, json; json.load(sys.stdin)" 2>/dev/null; then
            echo "FAIL: /api/health did not return valid JSON"
            exit 1
          fi
          echo "PASS: /api/health returned valid JSON"

      - name: API runs route check (no 5xx)
        run: |
          echo "=== open-swe API Runs Check ==="
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/api/open-swe/runs")
          if [ "$API_STATUS" -ge 500 ]; then
            echo "FAIL: API runs route returned $API_STATUS (5xx)"
            exit 1
          fi
          echo "PASS: API runs route returned $API_STATUS"

  smoke-test-result:
    name: Smoke Test — Result
    runs-on: ubuntu-latest
    needs: [deploy-staging, smoke-test-staging]
    if: always()
    steps:
      - name: Write result summary
        run: |
          {
            echo "## Smoke Test Results"
            echo ""
            echo "| Check | Status |"
            echo "| --- | --- |"
            echo "| Deploy to Vercel Preview | ${{ needs.deploy-staging.result }} |"
            echo "| Smoke Tests | ${{ needs.smoke-test-staging.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if smoke tests failed
        if: needs.smoke-test-staging.result == 'failure'
        run: |
          echo "Smoke tests failed. PR is blocked from merging."
          exit 1
