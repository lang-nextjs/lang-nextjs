# Port allocation: 3000 example · 3001 open-swe (also example in the django job,
# different runner) · 3002 example (fastapi job) · 5173 remix · 5174 sveltekit
#
# Within a job the ports live in ONE place — the job-level `env:` block — and
# every launch, wait and URL reads from it. They previously lived in three
# places (script flags, step env, hardcoded wait loops) which were free to
# disagree, and did: apps/open-swe hardcoded `--port 3000` while this file set
# PORT: 3001, and the CLI flag wins.
name: E2E

on:
  pull_request:
    branches: [main, feat/ai-backend-matrix]
  push:
    branches: [main, feat/ai-backend-matrix]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-mocked:
    name: E2E — Mocked (no backend required)
    runs-on: ubuntu-latest
    env:
      EXAMPLE_PORT: 3000
      OPENSWE_PORT: 3001
      REMIX_PORT: 5173
      SVELTEKIT_PORT: 5174
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build packages
        run: pnpm build

      # Each server is launched AND waited for in the same step. The previous
      # shape backgrounded four servers in four bare `run: <cmd> &` steps and
      # waited for all of them in a fifth: because `&` makes the step's exit
      # status the shell's rather than the server's, a server that died on
      # startup still reported [success] and the failure surfaced 60s later at
      # an unrelated step name. Pairing them means a dead server fails at the
      # step that started it.
      #
      # Known limitation, deliberate: `cmd &` still discards the server's exit
      # code, so the diagnosis is "never became reachable", not "exited 1".
      # Fixing that properly needs `wait -n`/PID trapping and is out of scope.
      - name: Start Next.js dev server (example)
        env:
          PORT: ${{ env.EXAMPLE_PORT }}
          ENABLE_STREAM_RECONNECT: 'true'
        run: |
          pnpm --filter example dev &
          timeout 60 bash -c 'until curl -sf http://localhost:'"$PORT"'/ >/dev/null 2>&1; do sleep 2; done'
          echo "example ready on :$PORT"

      - name: Start Remix dev server
        # BACKEND_URL pinned to a reserved unreachable address so the
        # E2E-05b adapter-proof test (request.post bypassing page.route)
        # can rely on createDeepAgentsHandler hitting its 502 "upstream
        # error" branch deterministically. Without the pin, a process
        # listening on the default :8000 (e.g. LangGraph Platform) would
        # either fail the test or, worse, satisfy it for the wrong reason.
        #
        # Port note: remix-example binds via Vite's 5173 default (no --port
        # flag, no server.port in vite.config), so REMIX_PORT is the wait's
        # source of truth rather than an override. Changing the port needs a
        # vite.config/script change too.
        env:
          BACKEND_URL: http://127.0.0.1:1/unreachable
        run: |
          pnpm --filter remix-example dev &
          timeout 60 bash -c 'until curl -sf http://localhost:'"$REMIX_PORT"'/ >/dev/null 2>&1; do sleep 2; done'
          echo "remix ready on :$REMIX_PORT"

      - name: Start SvelteKit dev server
        # Same rationale as the Remix server above — pin BACKEND_URL so
        # E2E-06b's adapter-proof assertion is deterministic.
        #
        # Port note: sveltekit-example hardcodes `--port 5174 --strictPort`
        # in its dev script. --strictPort is why that hardcode is safe where
        # open-swe's `--port 3000` was not: a mismatch aborts loudly instead
        # of drifting onto another port.
        env:
          BACKEND_URL: http://127.0.0.1:1/unreachable
        run: |
          pnpm --filter sveltekit-example dev &
          timeout 60 bash -c 'until curl -sf http://localhost:'"$SVELTEKIT_PORT"'/ >/dev/null 2>&1; do sleep 2; done'
          echo "sveltekit ready on :$SVELTEKIT_PORT"

      - name: Start open-swe dev server
        env:
          PORT: ${{ env.OPENSWE_PORT }}
        run: |
          # Guarded on the manifest: a rung-1/2/3 fork has no open-swe app, and starting one it
          # does not have is a step that can only fail. The EXIT CODE is checked, not just
          # stdout: `$( )` inside a `[ ]` comparison discards it, and the first version of this
          # guard therefore skipped silently on any misinvocation — the defect it was written to
          # prevent, in the mechanism that prevents it.
          if ! __rung=$(node scripts/has-rung.mjs open-swe); then
            echo "FAIL: cannot determine whether the open-swe rung is present" >&2; exit 1
          fi
          if [ "$__rung" != "yes" ]; then
            echo "open-swe rung not in this tree — skipping"; exit 0
          fi
          pnpm --filter open-swe dev &
          timeout 60 bash -c 'until curl -sf http://localhost:'"$PORT"'/ >/dev/null 2>&1; do sleep 2; done'
          echo "open-swe ready on :$PORT"

      - name: Run mocked E2E tests (E2E-01 through E2E-11, CI-01)
        # Explicitly enumerate projects:
        # - chromium-sandbox needs Docker (own job e2e-sandbox)
        # - chromium-llm needs OPENROUTER_API_KEY (own job e2e-llm)
        # - visual project owns screenshot baselines (own job e2e-visual)
        # Including any of those here would either skip silently or fail
        # this job for a reason it can't fix.
        # Browser matrix: webkit + firefox + mobile-chrome run a curated
        # cross-browser subset (defined in playwright.config.ts).
        #
        # PLAYWRIGHT_OPENSWE_URL must be set explicitly. Without it the three
        # open-swe projects fall back to playwright.config.ts's default, and
        # since the example app also serves `/` and `/api/open-swe/runs*`,
        # pointing them at :3000 makes their mocks attach to the wrong server
        # instead of failing.
        run: pnpm e2e --project=chromium --project=chromium-matrix --project=webkit --project=firefox --project=mobile-chrome --project=open-swe-dashboard --project=remix --project=sveltekit --project=open-swe
        env:
          ENABLE_STREAM_RECONNECT: 'true'
          CI: 'true'
          PLAYWRIGHT_OPENSWE_URL: http://localhost:${{ env.OPENSWE_PORT }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-mocked
          path: playwright-report/
          retention-days: 7

  e2e-django:
    name: E2E — Django backend
    runs-on: ubuntu-latest
    # Skip on external PRs (forks don't have access to secrets)
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build packages
        run: pnpm build

      - name: Start Django backend (compose — backend + db + redis only)
        working-directory: apps/django-backend
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: docker compose up -d

      - name: Wait for Django backend to be healthy
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:8002/health/; do sleep 3; done'
          echo "Django backend ready on :8002"

      - name: Start example Next.js app (host, points at Django)
        env:
          # Django compose maps host:8002 -> container:8000 (apps/django-backend/docker-compose.yml).
          BACKEND_URL: http://localhost:8002/api/chat/stream/
          PORT: 3001
        run: |
          pnpm --filter example start &
          timeout 30 bash -c 'until curl -sf http://localhost:3001/; do sleep 2; done'
          echo "Next.js frontend ready on :3001"

      - name: Run E2E suite against Django
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001
        # Filter to chromium only (remix/sveltekit/open-swe projects need their
        # own servers, only started in the e2e-mocked job). Skip chat.spec.ts —
        # those tests hit a real LLM and are already covered by the mocked job;
        # running them here doubles cost and risks LLM-availability flakes.
        run: pnpm e2e --project=chromium --project=chromium-matrix --grep-invert "SSE transport and defaultTransforms"

      - name: Verify plan-execute topology against real Django backend
        # The chromium suite mocks /api/chat/stream, so it never exercises the
        # plan-execute topology against a real backend. This step posts
        # body.topology="plan-execute" through the proxy to the live backend
        # and asserts the dispatch resolves and streams typed frames.
        run: |
          set -euo pipefail
          http_code=$(curl -s -o /tmp/pe-django.txt -w '%{http_code}' \
            -X POST http://localhost:3001/api/chat/stream \
            -H 'Content-Type: application/json' \
            --max-time 120 \
            -d '{"messages":[{"role":"user","content":"increment the counter once"}],"topology":"plan-execute"}')
          echo "HTTP $http_code"
          head -c 1000 /tmp/pe-django.txt; echo
          test "$http_code" = "200"
          grep -q '"type":' /tmp/pe-django.txt
          # NOT `! grep -q ...`. Bash exempts `!`-prefixed pipelines from
          # errexit, so under `set -e` that form skips the failure, the next
          # command returns 0, and the step passes having detected the error
          # frame it exists to detect. This assertion was inert on every run
          # until #99 (shellcheck SC2251).
          if grep -q '"type":"error"' /tmp/pe-django.txt; then
            echo "::error::Django plan-execute returned an error frame — the topology did not dispatch cleanly."
            exit 1
          fi
          echo "Django plan-execute topology OK"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-django
          path: playwright-report/
          retention-days: 7

      - name: Stop Django compose stack
        if: always()
        working-directory: apps/django-backend
        run: docker compose down -v

  e2e-fastapi:
    name: E2E — FastAPI backend
    runs-on: ubuntu-latest
    # Skip on external PRs (forks don't have access to secrets)
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build packages
        run: pnpm build

      - name: Start FastAPI backend (compose — backend only)
        working-directory: apps/fastapi-backend
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: docker compose up -d

      - name: Wait for FastAPI backend to be healthy
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:8001/health; do sleep 3; done'
          echo "FastAPI backend ready on :8001"

      - name: Start example Next.js app (host, points at FastAPI)
        env:
          BACKEND_URL: http://localhost:8001/api/chat/stream
          PORT: 3002
        run: |
          pnpm --filter example start &
          timeout 30 bash -c 'until curl -sf http://localhost:3002/; do sleep 2; done'
          echo "Next.js frontend ready on :3002"

      - name: Run E2E suite against FastAPI
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3002
        # Same filtering rationale as the Django job — see that step's comment.
        run: pnpm e2e --project=chromium --project=chromium-matrix --grep-invert "SSE transport and defaultTransforms"

      - name: Verify plan-execute topology against real FastAPI backend
        # See the Django job's equivalent step — exercises body.topology
        # ="plan-execute" through the proxy against the live FastAPI backend.
        run: |
          set -euo pipefail
          http_code=$(curl -s -o /tmp/pe-fastapi.txt -w '%{http_code}' \
            -X POST http://localhost:3002/api/chat/stream \
            -H 'Content-Type: application/json' \
            --max-time 120 \
            -d '{"messages":[{"role":"user","content":"increment the counter once"}],"topology":"plan-execute"}')
          echo "HTTP $http_code"
          head -c 1000 /tmp/pe-fastapi.txt; echo
          test "$http_code" = "200"
          grep -q '"type":' /tmp/pe-fastapi.txt
          # See the equivalent note in the Django job: `! grep -q ...` is exempt
          # from errexit and made this assertion inert (shellcheck SC2251).
          if grep -q '"type":"error"' /tmp/pe-fastapi.txt; then
            echo "::error::FastAPI plan-execute returned an error frame — the topology did not dispatch cleanly."
            exit 1
          fi
          echo "FastAPI plan-execute topology OK"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-fastapi
          path: playwright-report/
          retention-days: 7

      - name: Stop FastAPI compose stack
        if: always()
        working-directory: apps/fastapi-backend
        run: docker compose down -v

  e2e-sandbox:
    name: E2E — OpenSWE Docker sandbox
    runs-on: ubuntu-latest
    env:
      OPENSWE_PORT: 3001
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      # Launch and wait paired in one step — see the equivalent note in
      # e2e-mocked. This job is where the port bug was least survivable:
      # open-swe starts alone here, so nothing else held :3000 and the
      # hardcoded `--port 3000` bound cleanly while the wait sat on :3001
      # until it timed out at exit 124.
      - name: Start open-swe dev server
        env:
          PORT: ${{ env.OPENSWE_PORT }}
        run: |
          # Guarded on the manifest: a rung-1/2/3 fork has no open-swe app, and starting one it
          # does not have is a step that can only fail. The EXIT CODE is checked, not just
          # stdout: `$( )` inside a `[ ]` comparison discards it, and the first version of this
          # guard therefore skipped silently on any misinvocation — the defect it was written to
          # prevent, in the mechanism that prevents it.
          if ! __rung=$(node scripts/has-rung.mjs open-swe); then
            echo "FAIL: cannot determine whether the open-swe rung is present" >&2; exit 1
          fi
          if [ "$__rung" != "yes" ]; then
            echo "open-swe rung not in this tree — skipping"; exit 0
          fi
          pnpm --filter open-swe dev &
          timeout 60 bash -c 'until curl -sf http://localhost:'"$PORT"'/ >/dev/null 2>&1; do sleep 2; done'
          echo "open-swe ready on :$PORT"

      - name: Precheck — Docker daemon must be available
        # This job's whole reason for existing is the real-Docker sandbox spec.
        # If the daemon isn't reachable, every test in the spec silently
        # test.skip()s and the job goes green — a false positive that lets a
        # broken CI environment ship a "passing" build. Fail fast instead.
        run: |
          docker info > /dev/null 2>&1 || {
            echo "::error::Docker daemon not available on the runner — the chromium-sandbox job cannot fulfil its purpose. Investigate runner image / daemon startup instead of letting tests skip."
            exit 1
          }
          # Also confirm the sandbox HTTP probe returns available=true; this
          # catches misconfiguration where the daemon is up but the app can't
          # reach it (socket permission, etc).
          probe="$(curl -sf "http://localhost:$OPENSWE_PORT/api/open-swe/sandbox/health" || echo '{}')"
          echo "sandbox health probe: $probe"
          echo "$probe" | grep -q '"available":true' || {
            echo "::error::Sandbox health endpoint did not report available=true"
            exit 1
          }

      - name: Run Docker sandbox E2E
        # The job-level precheck above guarantees Docker is available; specs
        # still call test.skip when Docker is unreachable as a local-dev
        # convenience, but in CI that branch will not fire.
        #
        # PLAYWRIGHT_OPENSWE_URL set explicitly for the same reason as in
        # e2e-mocked — chromium-sandbox is one of the three open-swe projects.
        # It is the least forgiving of the three if mispointed: the example
        # app serves no /api/open-swe/sandbox/* routes at all.
        run: pnpm e2e --project=chromium-sandbox
        env:
          CI: 'true'
          PLAYWRIGHT_OPENSWE_URL: http://localhost:${{ env.OPENSWE_PORT }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-sandbox
          path: playwright-report/
          retention-days: 7

  llm-key-configured:
    name: Config — OPENROUTER_API_KEY is configured
    runs-on: ubuntu-latest
    # This job owns ONE subject: whether the repository has an OPENROUTER_API_KEY
    # configured. That subject TRACKS — the answer is genuinely "no" today and
    # flips the day someone sets the secret. A check may sit red permanently and
    # honestly, so long as its state follows its subject.
    #
    # It exists because `e2e-llm` below is gated on this job. A gated job that
    # does not run is SKIPPED, and GitHub scores a skipped job as NEUTRAL — the
    # workflow goes green. Gating e2e-llm without this companion would make the
    # missing key silent, which is the same false-green defect one layer up.
    #
    # SCOPED TO PUSH-TO-MAIN, NOT UNGATED — and the reason is not convenience.
    # The subject is REPO-LEVEL CONFIGURATION: a property of main, not of any
    # PR's diff. Nothing in any pull request can move it. Reporting it per-PR is
    # the right property in the wrong channel — a repo-level constant filed
    # where every reader is looking at a diff, which is the mirror of the defect
    # this whole arrangement was built to remove. It would also teach
    # contributors to ignore a red they cannot resolve, which is the same harm
    # relocated to a channel with more readers.
    #
    # THE MANDATORY CLAUSE: a check that declines to answer in EVERY channel has
    # lost the information — that is the original defect wearing the fix's
    # clothes. This one still runs, and still reports, where the subject IS
    # observable: push to main.
    #
    # WHEN IS A CONDITION ON A CHECK LEGITIMATE? Not by motive — motives are not
    # checkable and every gate rationalisation claims a good one. By what the
    # condition is a function of, which you can decide by reading it:
    #
    #   if: secrets.X != ''                          -> a function of the ANSWER.
    #                                                   Forbidden: it hides the
    #                                                   verdict it dislikes.
    #   if: head.repo.full_name == github.repository -> a function of whether an
    #                                                   answer is OBTAINABLE AT
    #                                                   ALL. Legitimate: it
    #                                                   describes the
    #                                                   INSTRUMENT'S REACH.
    #
    # The fork clause below is the second kind. On a fork PR the secret is not
    # exposed at all, so this job could not observe its subject and its red
    # would be a constant, not a verdict.
    #
    # It is REDUNDANT TODAY and deliberately kept: `pull_request` is not an event
    # this job runs on, so the clause is vacuously true. It is a CONJUNCT, so it
    # can only ever narrow, never widen — it cannot switch this job on for PRs.
    # It is here so that it GOVERNS THE MOMENT SOMEONE WIDENS THE TRIGGER,
    # rather than being a hole discovered afterwards.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check whether OPENROUTER_API_KEY is set
        id: check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "${OPENROUTER_API_KEY}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY is configured (length: ${#OPENROUTER_API_KEY})."
            echo "e2e-llm will run and its result will reflect the real LLM code path."
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::error::OPENROUTER_API_KEY is not configured for this repository."
          echo ""
          echo "Consequence: the 'E2E — Real LLM' job cannot run, so the real LLM"
          echo "code path is NOT being tested. That job is gated on this one"
          echo "precisely so its green/red never pretends otherwise."
          echo ""
          echo "This is a repository-secret decision and is not something CI can"
          echo "resolve for itself. Until the secret is set, this check stays red"
          echo "on purpose — that is the absence being reported, not a flake."
          exit 1

  e2e-llm:
    name: E2E — Real LLM (push to main only)
    runs-on: ubuntu-latest
    # ---------------------------------------------------------------------
    # INVARIANT: llm-key-configured's trigger must be a SUPERSET of this job's
    # trigger. Both are push-to-main today, so it holds.
    #
    # IF YOU WIDEN THE `if:` BELOW, WIDEN THE COMPANION'S FIRST.
    #
    # `needs:` skips this job when the companion does not run — and GitHub
    # scores a skipped job as NEUTRAL, i.e. GREEN. So widening this job to any
    # event the companion does not run on makes this job silently skip and the
    # workflow report success: the exact false-green this arrangement was added
    # to prevent, reintroduced through the mechanism that prevents it.
    #
    # This is invisible at precisely the point where someone would break it,
    # which is why it is written here and not only in a doc.
    # ---------------------------------------------------------------------
    needs: llm-key-configured
    # Gated on the key being configured so this job's state can TRACK ITS
    # SUBJECT — the real LLM code path. Before this gate it ran without a key,
    # died at a precheck, and was red on every run regardless of that code path:
    # a constant, not a verdict. Nothing anyone did to the LLM path could move
    # it, so it could not have detected a breakage.
    #
    # Skipping here is only safe because `llm-key-configured` above is ungated
    # and fails loudly. A skipped job scores NEUTRAL; the absence is reported by
    # that job, never by this one's absence. Do not remove the companion, and do
    # not add `continue-on-error` here — either one restores the false green.
    #
    # The `needs` alone would gate this (a failed dependency skips it). The
    # explicit outputs check is deliberate belt-and-braces: if someone later
    # makes the companion non-failing, this still gates correctly.
    if: >-
      needs.llm-key-configured.outputs.configured == 'true'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    steps:
      - name: Precheck — the key actually reached this job
        # FIRST STEP ON PURPOSE. This used to be the tenth, after checkout,
        # pnpm, Node, install, Playwright browsers, build, `docker compose up`
        # for Django+Postgres+Redis, a 120s health wait, and starting Next.js.
        # Ten runs paid for that entire stack to come up before failing on a
        # condition evaluable in the first second. It now costs seconds.
        #
        # WHAT THIS GUARDS, precisely: that the secret reached THIS JOB's env.
        # That is a different subject from `llm-key-configured` above, which
        # asks whether the repository has the secret at all. This one fails if
        # the `env:` mapping on the test step is dropped or misspelled — a real
        # and separate way for this job to run against no key.
        #
        # CORRECTION — the previous comment here said the spec `test.skip()`s
        # every test when the key is missing and would "silently report green".
        # That is STALE and people have reasoned from it and been wrong.
        # `e2e/shared/llm.spec.ts` THROWS when `CI === "true"`; it only skips in
        # local dev. So this step and that guard are REDUNDANT, not layered, and
        # the spec-level false-green they describe is already closed.
        #
        # The hazard that does exist is one layer up: a gated job that does not
        # run is SKIPPED, and GitHub scores skipped as NEUTRAL — green. That is
        # why `llm-key-configured` is ungated and mandatory, not why this step
        # is here.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::OPENROUTER_API_KEY did not reach this job's environment, even though llm-key-configured passed. Check the env: mapping on this job's steps."
            exit 1
          fi
          echo "OPENROUTER_API_KEY present (length: ${#OPENROUTER_API_KEY})"

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build packages
        run: pnpm build

      - name: Start Django backend (compose — backend + db + redis only)
        working-directory: apps/django-backend
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: docker compose up -d

      - name: Wait for Django backend to be healthy
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8002/health/; do sleep 3; done'
          echo "Django backend ready on :8002"

      - name: Start example Next.js app (host, points at Django)
        env:
          BACKEND_URL: http://localhost:8002/api/chat/stream/
          PORT: 3001
        run: |
          pnpm --filter example start &
          timeout 30 bash -c 'until curl -sf http://localhost:3001/; do sleep 2; done'
          echo "Next.js frontend ready on :3001"

      - name: Run real LLM E2E tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PLAYWRIGHT_BASE_URL: http://localhost:3001
        run: pnpm e2e --project=chromium-llm

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-llm
          path: playwright-report/
          retention-days: 7

      - name: Stop Django compose stack
        if: always()
        working-directory: apps/django-backend
        run: docker compose down -v
