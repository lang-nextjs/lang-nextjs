# Port allocation: 3000 example · 3001 open-swe (also example in the django job,
# different runner) · 3002 example (fastapi job) · 5173 remix · 5174 sveltekit
#
# Within a job the ports live in ONE place — the job-level `env:` block — and
# every launch, wait and URL reads from it. They previously lived in three
# places (script flags, step env, hardcoded wait loops) which were free to
# disagree, and did: apps/open-swe hardcoded `--port 3000` while this file set
# PORT: 3001, and the CLI flag wins.
name: E2E

on:
  # NO `branches:` FILTER HERE, DELIBERATELY.
  #
  # `pull_request.branches` filters on the BASE branch. While this read
  # `[main, feat/ai-backend-matrix]`, a pull request based on anything else
  # matched no trigger and ran NOTHING — and a PR page with no checks section
  # reads as fine to anyone scrolling past. Not a red we ignored, and not a
  # green over nothing: no checks at all.
  #
  # That is how #130 was merged with ZERO CI, gated on a named check that did
  # not exist. Every stacked PR had the same hole, which is most of them —
  # this team works in stacks routinely.
  #
  # An allowlist of base branches cannot survive that pattern: it needs editing
  # in six files every time someone opens a stack, and it is stale the moment
  # they do. So the filter is gone rather than widened. `push` keeps its filter;
  # that one is about which branches deserve a build, not about which pull
  # requests deserve review.
  pull_request:
  push:
    branches: [main, feat/ai-backend-matrix]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-mocked:
    name: E2E — Mocked (no backend required)
    runs-on: ubuntu-latest
    env:
      EXAMPLE_PORT: 3000
      OPENSWE_PORT: 3001
      REMIX_PORT: 5173
      SVELTEKIT_PORT: 5174
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build packages
        run: pnpm build

      # Each server is launched AND waited for in the same step. The previous
      # shape backgrounded four servers in four bare `run: <cmd> &` steps and
      # waited for all of them in a fifth: because `&` makes the step's exit
      # status the shell's rather than the server's, a server that died on
      # startup still reported [success] and the failure surfaced 60s later at
      # an unrelated step name. Pairing them means a dead server fails at the
      # step that started it.
      #
      # Known limitation, deliberate: `cmd &` still discards the server's exit
      # code, so the diagnosis is "never became reachable", not "exited 1".
      # Fixing that properly needs `wait -n`/PID trapping and is out of scope.
      - name: Start Next.js dev server (example)
        env:
          PORT: ${{ env.EXAMPLE_PORT }}
          ENABLE_STREAM_RECONNECT: 'true'
        run: |
          # The proof runs in THIS workflow, beside the checker it proves — a
          # proof in another workflow does not gate this one (see
          # scripts/assert-checker-proof-pairing.mjs, point 3).
          bash .github/scripts/warm-routes.selftest.sh
          pnpm --filter example dev &
          timeout 60 bash -c 'until curl -sf http://localhost:'"$PORT"'/ >/dev/null 2>&1; do sleep 2; done'
          echo "example ready on :$PORT"
          # WAITING FOR `/` IS NOT THE SAME AS BEING READY (#114).
          #
          # Turbopack compiles routes on demand, so every other route this suite
          # touches was compiled for the first time INSIDE a test's assertion
          # budget. `/api/hitl-demo` fetches `/api/hitl-demo/backend` — itself,
          # on this same server — and that self-fetch is server-to-server, so a
          # cold backend route looked like a hung stream rather than a cold one.
          #
          # Measured from run 33122518899's own trace: the proxy answered in
          # 35ms and then sent nothing for the full 15s, with the page reading
          # "Agent:" and no frames at all.
          bash .github/scripts/warm-routes.sh "http://localhost:$PORT" --with-hitl

      - name: Start Remix dev server
        # BACKEND_URL pinned to a reserved unreachable address so the
        # SPEC-05b adapter-proof test (request.post bypassing page.route)
        # can rely on createDeepAgentsHandler hitting its 502 "upstream
        # error" branch deterministically. Without the pin, a process
        # listening on the default :8000 (e.g. LangGraph Platform) would
        # either fail the test or, worse, satisfy it for the wrong reason.
        #
        # Port note: remix-example binds via Vite's 5173 default (no --port
        # flag, no server.port in vite.config), so REMIX_PORT is the wait's
        # source of truth rather than an override. Changing the port needs a
        # vite.config/script change too.
        env:
          BACKEND_URL: http://127.0.0.1:1/unreachable
        run: |
          pnpm --filter remix-example dev &
          timeout 60 bash -c 'until curl -sf http://localhost:'"$REMIX_PORT"'/ >/dev/null 2>&1; do sleep 2; done'
          echo "remix ready on :$REMIX_PORT"

      - name: Start SvelteKit dev server
        # Same rationale as the Remix server above — pin BACKEND_URL so
        # SPEC-06b's adapter-proof assertion is deterministic.
        #
        # Port note: sveltekit-example hardcodes `--port 5174 --strictPort`
        # in its dev script. --strictPort is why that hardcode is safe where
        # open-swe's `--port 3000` was not: a mismatch aborts loudly instead
        # of drifting onto another port.
        env:
          BACKEND_URL: http://127.0.0.1:1/unreachable
        run: |
          pnpm --filter sveltekit-example dev &
          timeout 60 bash -c 'until curl -sf http://localhost:'"$SVELTEKIT_PORT"'/ >/dev/null 2>&1; do sleep 2; done'
          echo "sveltekit ready on :$SVELTEKIT_PORT"

      - name: Start open-swe dev server
        env:
          PORT: ${{ env.OPENSWE_PORT }}
        run: |
          # Guarded on the manifest: a rung-1/2/3 fork has no open-swe app, and starting one it
          # does not have is a step that can only fail. The EXIT CODE is checked, not just
          # stdout: `$( )` inside a `[ ]` comparison discards it, and the first version of this
          # guard therefore skipped silently on any misinvocation — the defect it was written to
          # prevent, in the mechanism that prevents it.
          if ! __rung=$(node scripts/has-rung.mjs open-swe); then
            echo "FAIL: cannot determine whether the open-swe rung is present" >&2; exit 1
          fi
          if [ "$__rung" != "yes" ]; then
            echo "open-swe rung not in this tree — skipping"; exit 0
          fi
          pnpm --filter open-swe dev &
          timeout 60 bash -c 'until curl -sf http://localhost:'"$PORT"'/ >/dev/null 2>&1; do sleep 2; done'
          echo "open-swe ready on :$PORT"

      # SPEC-NN ARE THE SUITE'S OWN TEST IDS, and before 2026-08-26 they were written

      # E2E-NN — which COLLIDED with the requirement ids in .planning/PROJECT.md.

      # Two unrelated numbering schemes shared one namespace, so 'find the test that

      # earns this requirement' returned a green test that tested something else:

      #   E2E-01  requirement: django emits DeepAgents SSE wire format

      #           suite      : auth cookie forwarded as Authorization: Bearer

      # The SUITE yielded, not the requirements: a requirement id is a HISTORICAL KEY

      # whose whole job is to let someone find what was decided and when, and 38

      # .planning documents depend on it. A test id is a LIVE LABEL. You rename live

      # labels, never archival keys. Older commits and SESSION_POSTMORTEM.md still say

      # E2E-NN in the suite sense.

      - name: Run mocked E2E tests (SPEC-01 through SPEC-11, CI-01)
        # Explicitly enumerate projects:
        # - chromium-sandbox needs Docker (own job e2e-sandbox)
        # - chromium-llm needs a model API key (own job e2e-llm)
        # - visual project owns screenshot baselines (own job e2e-visual)
        # Including any of those here would either skip silently or fail
        # this job for a reason it can't fix.
        # Browser matrix: webkit + firefox + mobile-chrome run a curated
        # cross-browser subset (defined in playwright.config.ts).
        #
        # PLAYWRIGHT_OPENSWE_URL must be set explicitly. Without it the three
        # open-swe projects fall back to playwright.config.ts's default, and
        # since the example app also serves `/` and `/api/open-swe/runs*`,
        # pointing them at :3000 makes their mocks attach to the wrong server
        # instead of failing.
        run: pnpm e2e --project=chromium --project=chromium-matrix --project=webkit --project=firefox --project=mobile-chrome --project=open-swe-mobile --project=open-swe-dashboard --project=remix --project=sveltekit --project=open-swe
        env:
          ENABLE_STREAM_RECONNECT: 'true'
          CI: 'true'
          PLAYWRIGHT_OPENSWE_URL: http://localhost:${{ env.OPENSWE_PORT }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-mocked
          path: playwright-report/
          retention-days: 7

  e2e-django:
    name: E2E — Django backend
    runs-on: ubuntu-latest
    # Skip on external PRs (forks don't have access to secrets)
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build packages
        run: pnpm build

      - name: Start Django backend (compose — backend + db + redis only)
        working-directory: apps/django-backend
        # NO MODEL KEY, DELIBERATELY. This is a per-PR job: it proves the
        # transport and topology dispatch, and must stay fast and deterministic.
        # Handing it a key makes it do real inference — which is exactly what
        # happened once the compose files began forwarding one, and the
        # plan-execute probe then timed out (curl exit 28) after two minutes.
        # Real inference has its own push-to-main jobs: e2e-llm and
        # e2e-live-transport.
        run: docker compose up -d

      - name: Wait for Django backend to be healthy
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:8002/health/; do sleep 3; done'
          echo "Django backend ready on :8002"

      - name: Start example Next.js app (host, points at Django)
        env:
          # Django compose maps host:8002 -> container:8000 (apps/django-backend/docker-compose.yml).
          BACKEND_URL: http://localhost:8002/api/chat/stream/
          PORT: 3001
        run: |
          pnpm --filter example start &
          timeout 30 bash -c 'until curl -sf http://localhost:3001/; do sleep 2; done'
          echo "Next.js frontend ready on :3001"

      - name: Run E2E suite against Django
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001
        # Filter to chromium only (remix/sveltekit/open-swe projects need their
        # own servers, only started in the e2e-mocked job). Skip chat.spec.ts —
        # those tests hit a real LLM and are already covered by the mocked job;
        # running them here doubles cost and risks LLM-availability flakes.
        run: pnpm e2e --project=chromium --project=chromium-matrix --grep-invert "SSE transport and defaultTransforms"

      - name: Verify plan-execute topology against real Django backend
        # The chromium suite mocks /api/chat/stream, so it never exercises the
        # plan-execute topology against a real backend. This step posts
        # body.topology="plan-execute" through the proxy to the live backend
        # and asserts the dispatch resolves and streams typed frames.
        run: |
          set -euo pipefail
          http_code=$(curl -s -o /tmp/pe-django.txt -w '%{http_code}' \
            -X POST http://localhost:3001/api/chat/stream \
            -H 'Content-Type: application/json' \
            --max-time 120 \
            -d '{"messages":[{"role":"user","content":"increment the counter once"}],"topology":"plan-execute"}')
          echo "HTTP $http_code"
          head -c 1000 /tmp/pe-django.txt; echo
          test "$http_code" = "200"
          grep -q '"type":' /tmp/pe-django.txt
          # NOT `! grep -q ...`. Bash exempts `!`-prefixed pipelines from
          # errexit, so under `set -e` that form skips the failure, the next
          # command returns 0, and the step passes having detected the error
          # frame it exists to detect. This assertion was inert on every run
          # until #99 (shellcheck SC2251).
          if grep -q '"type":"error"' /tmp/pe-django.txt; then
            echo "::error::Django plan-execute returned an error frame — the topology did not dispatch cleanly."
            exit 1
          fi
          echo "Django plan-execute topology OK"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-django
          path: playwright-report/
          retention-days: 7

      - name: Stop Django compose stack
        if: always()
        working-directory: apps/django-backend
        run: docker compose down -v

  e2e-fastapi:
    name: E2E — FastAPI backend
    runs-on: ubuntu-latest
    # Skip on external PRs (forks don't have access to secrets)
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build packages
        run: pnpm build

      - name: Start FastAPI backend (compose — backend only)
        working-directory: apps/fastapi-backend
        # NO MODEL KEY, DELIBERATELY. This is a per-PR job: it proves the
        # transport and topology dispatch, and must stay fast and deterministic.
        # Handing it a key makes it do real inference — which is exactly what
        # happened once the compose files began forwarding one, and the
        # plan-execute probe then timed out (curl exit 28) after two minutes.
        # Real inference has its own push-to-main jobs: e2e-llm and
        # e2e-live-transport.
        run: docker compose up -d

      - name: Wait for FastAPI backend to be healthy
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:8001/health; do sleep 3; done'
          echo "FastAPI backend ready on :8001"

      - name: Start example Next.js app (host, points at FastAPI)
        env:
          BACKEND_URL: http://localhost:8001/api/chat/stream
          PORT: 3002
        run: |
          pnpm --filter example start &
          timeout 30 bash -c 'until curl -sf http://localhost:3002/; do sleep 2; done'
          echo "Next.js frontend ready on :3002"

      - name: Run E2E suite against FastAPI
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3002
        # Same filtering rationale as the Django job — see that step's comment.
        run: pnpm e2e --project=chromium --project=chromium-matrix --grep-invert "SSE transport and defaultTransforms"

      - name: Verify plan-execute topology against real FastAPI backend
        # See the Django job's equivalent step — exercises body.topology
        # ="plan-execute" through the proxy against the live FastAPI backend.
        run: |
          set -euo pipefail
          http_code=$(curl -s -o /tmp/pe-fastapi.txt -w '%{http_code}' \
            -X POST http://localhost:3002/api/chat/stream \
            -H 'Content-Type: application/json' \
            --max-time 120 \
            -d '{"messages":[{"role":"user","content":"increment the counter once"}],"topology":"plan-execute"}')
          echo "HTTP $http_code"
          head -c 1000 /tmp/pe-fastapi.txt; echo
          test "$http_code" = "200"
          grep -q '"type":' /tmp/pe-fastapi.txt
          # See the equivalent note in the Django job: `! grep -q ...` is exempt
          # from errexit and made this assertion inert (shellcheck SC2251).
          if grep -q '"type":"error"' /tmp/pe-fastapi.txt; then
            echo "::error::FastAPI plan-execute returned an error frame — the topology did not dispatch cleanly."
            exit 1
          fi
          echo "FastAPI plan-execute topology OK"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-fastapi
          path: playwright-report/
          retention-days: 7

      - name: Stop FastAPI compose stack
        if: always()
        working-directory: apps/fastapi-backend
        run: docker compose down -v

  e2e-live-transport:
    name: E2E — open-swe live transport (push to main only)
    runs-on: ubuntu-latest
    # ---------------------------------------------------------------------
    # WHY THIS IS ITS OWN GATED JOB AND NOT PART OF e2e-django / e2e-fastapi,
    # which is where #153 first put it.
    #
    # This suite drives a REAL model through open-swe. It cannot pass without
    # a model API key, and whether this repository has one is owned by — see
    # llm-key-configured below, which owns that subject and says so. Mounted in
    # the per-PR backend jobs it did not fail because the transport was broken;
    # it failed because the backend had no model to call, reporting
    # `upstream_disconnect` about 150ms in, against a ~4s baseline for a real
    # streamed response.
    #
    # A JOB THAT STRUCTURALLY CANNOT PASS IS NOT A FAILING TEST — it is a
    # permanently red light, and unlike llm-key-configured (which is red BY
    # DESIGN and announces that in its own output) two red e2e jobs announce
    # nothing. They read as broken tests, every rebase attributes them to the
    # rebaser, and within a day the column stops being read.
    #
    # THE CONDITION IS THE SANCTIONED KIND, per the rule written out in
    # llm-key-configured: `if: secrets.X != ''` is a function of THE ANSWER and
    # is forbidden because it hides the verdict it dislikes. `needs:` on the
    # companion job is a function of whether an answer is OBTAINABLE AT ALL,
    # which describes the instrument's reach. That is this one.
    #
    # WHAT IT COSTS, so it is chosen rather than discovered: #153 asked for
    # per-PR feedback on live transport and this gives push-to-main feedback
    # instead. That is a real reduction, accepted deliberately — the alternative
    # is not more feedback, it is a red job nobody reads. The day someone sets
    # the secret this gate opens on its own and per-PR coverage needs no further
    # decision.
    #
    # SAME INVARIANT AS e2e-llm: llm-key-configured's trigger must remain a
    # SUPERSET of this job's. IF YOU WIDEN THE `if:` BELOW, WIDEN THE
    # COMPANION'S FIRST — a skipped job scores NEUTRAL, i.e. green.
    # ---------------------------------------------------------------------
    needs: llm-key-configured
    if: >-
      needs.llm-key-configured.outputs.configured == 'true'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build packages
        run: pnpm build

      - name: Start Django backend (compose — backend + db + redis only)
        working-directory: apps/django-backend
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: docker compose up -d

      - name: Wait for Django backend to be healthy
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:8002/health/; do sleep 3; done'
          echo "Django backend ready on :8002"

      - name: Start FastAPI backend (compose — backend only)
        working-directory: apps/fastapi-backend
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: docker compose up -d

      - name: Wait for FastAPI backend to be healthy
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:8001/health; do sleep 3; done'
          echo "FastAPI backend ready on :8001"

      # #153 — open-swe is the app people actually work in, and until this suite
      # NO e2e had ever run it against a live backend: both live-backend jobs
      # started only the example app. buildBackendUrl's django trailing-slash
      # rule, per-runtime token forwarding and the 502 path were covered by unit
      # tests and mocked e2e only, and neither can prove the app talks to a real
      # Django.
      #
      # ADDITIVE, deliberately. The example specs are NOT moved: apps/example is
      # `shared` in rungs.json and apps/open-swe is owned by rung 4, so coverage
      # relocated into open-swe is coverage a rung-1 fork loses.
      - name: Start example Next.js app (the counter the live tools call)
        # THE TOOL MATRIX COUNTS A REAL SIDE EFFECT, AND SOMETHING HAS TO HOLD IT.
        #
        # `open-swe-matrix-tools-live.spec.ts` asserts the counter advanced by
        # exactly the number of reported `increment` calls, reading it from
        # COUNTER_URL (default http://localhost:3000/api/counter). The Python
        # tools write to the same endpoint via host.docker.internal:3000.
        #
        # This job never started that app. It could not have passed: it has been
        # gated behind a model key this repository did not have, so the step was
        # skipped on every run since it was written, and a configuration nothing
        # executes is a configuration nobody has checked. The first real run
        # failed with `connect ECONNREFUSED ::1:3000` — the spec's own
        # precondition, firing exactly as designed.
        env:
          # No BACKEND_URL: the chat path is not what this app is here for. It
          # holds the counter, and pointing it at a backend would only add a
          # dependency this step does not need.
          PORT: 3000
        run: |
          pnpm --filter example start &
          timeout 60 bash -c 'until curl -sf http://localhost:3000/api/counter; do sleep 2; done'
          echo "counter app ready on :3000"

          # REACHABLE FROM THE RUNNER IS NOT REACHABLE FROM THE CONTAINERS.
          #
          # The tools call http://host.docker.internal:3000/api/counter from
          # inside the backend containers. Docker Desktop resolves that name for
          # free; a Linux runner does not, unless the compose file declares
          # `extra_hosts: host.docker.internal:host-gateway`. The fastapi compose
          # did not, and the write went nowhere — silently, because reads come
          # from the runner and kept working. The matrix then reported calls
          # against a counter frozen at one value, for every framework at once.
          #
          # Asserted from inside a container, which is the only place the answer
          # means anything. A curl from here would have passed throughout.
          docker run --rm --add-host host.docker.internal:host-gateway curlimages/curl:8.11.1 \
            -sf --max-time 10 http://host.docker.internal:3000/api/counter > /dev/null || {
              echo "::error::the counter endpoint is not reachable from a container via host.docker.internal — the tools' writes would vanish and the matrix would measure a frozen counter"
              exit 1
            }
          echo "counter app reachable from a container"

      - name: Start open-swe (host, points at the live Django)
        env:
          DJANGO_URL: http://localhost:8002/api/chat/stream
          PORT: 3005
        run: |
          # Guarded on the manifest, like every other open-swe invocation in
          # this file: a rung-1/2/3 fork has no open-swe app, and starting one it
          # does not have is a step that can only fail.
          # The EXIT CODE is checked, not just stdout — `$( )` inside a `[ ]`
          # comparison discards it, and the first version of this guard
          # therefore skipped silently on any misinvocation.
          if ! __rung=$(node scripts/has-rung.mjs open-swe); then
            echo "FAIL: cannot determine whether the open-swe rung is present" >&2; exit 1
          fi
          if [ "$__rung" != "yes" ]; then
            echo "open-swe rung not in this tree — skipping"; exit 0
          fi
          pnpm --filter open-swe start &
          timeout 60 bash -c 'until curl -sf http://localhost:3005/chat; do sleep 2; done'
          echo "open-swe ready on :3005 (DJANGO_URL set, FASTAPI_URL deliberately unset)"

      - name: Run open-swe live-transport suite against Django
        env:
          PLAYWRIGHT_OPENSWE_URL: http://localhost:3005
          LIVE_RUNTIME: django
          # The spec reads this to assert Django rejects the slash-less URL
          # itself, rather than trusting buildBackendUrl's own output.
          DJANGO_URL: http://localhost:8002/api/chat/stream
          # The spec asserts the backend reports a configured LLM before it
          # blames the transport for an empty stream.
          LIVE_HEALTH_URL: http://localhost:8002/health/
        run: |
          # Guarded on the manifest, like every other open-swe invocation in
          # this file: eject prunes the open-swe-live playwright project along with
          # the specs it names, so `--project=open-swe-live` in a rung-1/2/3
          # fork is an unknown-project error, not a skipped test.
          # The EXIT CODE is checked, not just stdout — `$( )` inside a `[ ]`
          # comparison discards it, and the first version of this guard
          # therefore skipped silently on any misinvocation.
          if ! __rung=$(node scripts/has-rung.mjs open-swe); then
            echo "FAIL: cannot determine whether the open-swe rung is present" >&2; exit 1
          fi
          if [ "$__rung" != "yes" ]; then
            echo "open-swe rung not in this tree — skipping"; exit 0
          fi
          pnpm e2e --project=open-swe-live

      - name: Run the live tool matrix (framework x mode) against Django
        env:
          PLAYWRIGHT_OPENSWE_URL: http://localhost:3005
          LIVE_RUNTIME: django
        run: |
          # SAME MANIFEST GUARD as the step above, and the same reason: eject
          # prunes this playwright project with the specs it names, so naming it
          # in a rung-1/2/3 fork is an unknown-project error rather than a skip.
          if ! __rung=$(node scripts/has-rung.mjs open-swe); then
            echo "FAIL: cannot determine whether the open-swe rung is present" >&2; exit 1
          fi
          if [ "$__rung" != "yes" ]; then
            echo "open-swe rung not in this tree — skipping"; exit 0
          fi
          # Its own step, not folded into the line above: the suite asserts on a
          # single shared counter and must not run concurrently with anything
          # else that POSTs /api/counter.
          pnpm e2e --project=matrix-tools-live

      - name: Start open-swe (host, points at the live FastAPI)
        env:
          FASTAPI_URL: http://localhost:8001/api/chat/stream
          PORT: 3006
        run: |
          # Guarded on the manifest, like every other open-swe invocation in
          # this file: a rung-1/2/3 fork has no open-swe app, and starting one it
          # does not have is a step that can only fail.
          # The EXIT CODE is checked, not just stdout — `$( )` inside a `[ ]`
          # comparison discards it, and the first version of this guard
          # therefore skipped silently on any misinvocation.
          if ! __rung=$(node scripts/has-rung.mjs open-swe); then
            echo "FAIL: cannot determine whether the open-swe rung is present" >&2; exit 1
          fi
          if [ "$__rung" != "yes" ]; then
            echo "open-swe rung not in this tree — skipping"; exit 0
          fi
          pnpm --filter open-swe start &
          timeout 60 bash -c 'until curl -sf http://localhost:3006/chat; do sleep 2; done'
          echo "open-swe ready on :3006 (FASTAPI_URL set, DJANGO_URL deliberately unset)"

      - name: Run open-swe live-transport suite against FastAPI
        env:
          PLAYWRIGHT_OPENSWE_URL: http://localhost:3006
          LIVE_RUNTIME: fastapi
          FASTAPI_URL: http://localhost:8001/api/chat/stream
          LIVE_HEALTH_URL: http://localhost:8001/health
        run: |
          # Guarded on the manifest, like every other open-swe invocation in
          # this file: eject prunes the open-swe-live playwright project along with
          # the specs it names, so `--project=open-swe-live` in a rung-1/2/3
          # fork is an unknown-project error, not a skipped test.
          # The EXIT CODE is checked, not just stdout — `$( )` inside a `[ ]`
          # comparison discards it, and the first version of this guard
          # therefore skipped silently on any misinvocation.
          if ! __rung=$(node scripts/has-rung.mjs open-swe); then
            echo "FAIL: cannot determine whether the open-swe rung is present" >&2; exit 1
          fi
          if [ "$__rung" != "yes" ]; then
            echo "open-swe rung not in this tree — skipping"; exit 0
          fi
          pnpm e2e --project=open-swe-live

      - name: Run the live tool matrix (framework x mode) against FastAPI
        env:
          PLAYWRIGHT_OPENSWE_URL: http://localhost:3006
          LIVE_RUNTIME: fastapi
        run: |
          # SAME MANIFEST GUARD as the step above, and the same reason: eject
          # prunes this playwright project with the specs it names, so naming it
          # in a rung-1/2/3 fork is an unknown-project error rather than a skip.
          if ! __rung=$(node scripts/has-rung.mjs open-swe); then
            echo "FAIL: cannot determine whether the open-swe rung is present" >&2; exit 1
          fi
          if [ "$__rung" != "yes" ]; then
            echo "open-swe rung not in this tree — skipping"; exit 0
          fi
          # Its own step, not folded into the line above: the suite asserts on a
          # single shared counter and must not run concurrently with anything
          # else that POSTs /api/counter.
          pnpm e2e --project=matrix-tools-live

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-live-transport
          path: playwright-report/
          retention-days: 7

      - name: Stop Django compose stack
        if: always()
        working-directory: apps/django-backend
        run: docker compose down -v

      - name: Stop FastAPI compose stack
        if: always()
        working-directory: apps/fastapi-backend
        run: docker compose down -v

  e2e-sandbox:
    name: E2E — OpenSWE Docker sandbox
    runs-on: ubuntu-latest
    env:
      OPENSWE_PORT: 3001
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      # THE WORKSPACE PACKAGES MUST BE BUILT BEFORE A DEV SERVER STARTS.
      #
      # Every other e2e job builds; this one did not, and it was the only one
      # that did not. That was survivable exactly as long as open-swe imported
      # nothing whose entry point is a build artifact — and it stopped being
      # survivable when lib/frameworks.ts began importing
      # @deepagents-nextjs/rungs to derive the framework and topology lists.
      #
      # packages/rungs resolves to ./dist/index.js. Without a build there is no
      # dist, so Next could not resolve the module and every route 500'd; the
      # wait-for-port then sat until it timed out at exit 124. The visible
      # symptom was a TIMEOUT, which reads as a slow or wedged server and sends
      # you to look at ports — the failure that actually happened was a missing
      # module, reported three steps away from its cause.
      #
      # apps/open-swe/next.config.ts sets no transpilePackages, so it consumes
      # built output rather than source. Adding the rung package there would
      # also work, but building matches the other four e2e jobs, and one job
      # resolving its workspace deps differently from the rest is the kind of
      # difference that only shows up as a mystery timeout.
      - name: Build workspace packages
        run: pnpm build

      # Launch and wait paired in one step — see the equivalent note in
      # e2e-mocked. This job is where the port bug was least survivable:
      # open-swe starts alone here, so nothing else held :3000 and the
      # hardcoded `--port 3000` bound cleanly while the wait sat on :3001
      # until it timed out at exit 124.
      - name: Start open-swe dev server
        env:
          PORT: ${{ env.OPENSWE_PORT }}
        run: |
          # Guarded on the manifest: a rung-1/2/3 fork has no open-swe app, and starting one it
          # does not have is a step that can only fail. The EXIT CODE is checked, not just
          # stdout: `$( )` inside a `[ ]` comparison discards it, and the first version of this
          # guard therefore skipped silently on any misinvocation — the defect it was written to
          # prevent, in the mechanism that prevents it.
          if ! __rung=$(node scripts/has-rung.mjs open-swe); then
            echo "FAIL: cannot determine whether the open-swe rung is present" >&2; exit 1
          fi
          if [ "$__rung" != "yes" ]; then
            echo "open-swe rung not in this tree — skipping"; exit 0
          fi
          pnpm --filter open-swe dev &
          timeout 60 bash -c 'until curl -sf http://localhost:'"$PORT"'/ >/dev/null 2>&1; do sleep 2; done'
          echo "open-swe ready on :$PORT"

      - name: Precheck — Docker daemon must be available
        # This job's whole reason for existing is the real-Docker sandbox spec.
        # If the daemon isn't reachable, every test in the spec silently
        # test.skip()s and the job goes green — a false positive that lets a
        # broken CI environment ship a "passing" build. Fail fast instead.
        run: |
          docker info > /dev/null 2>&1 || {
            echo "::error::Docker daemon not available on the runner — the chromium-sandbox job cannot fulfil its purpose. Investigate runner image / daemon startup instead of letting tests skip."
            exit 1
          }
          # Also confirm the sandbox HTTP probe returns available=true; this
          # catches misconfiguration where the daemon is up but the app can't
          # reach it (socket permission, etc).
          probe="$(curl -sf "http://localhost:$OPENSWE_PORT/api/open-swe/sandbox/health" || echo '{}')"
          echo "sandbox health probe: $probe"
          echo "$probe" | grep -q '"available":true' || {
            echo "::error::Sandbox health endpoint did not report available=true"
            exit 1
          }

      - name: Run Docker sandbox E2E
        # The job-level precheck above guarantees Docker is available; specs
        # still call test.skip when Docker is unreachable as a local-dev
        # convenience, but in CI that branch will not fire.
        #
        # PLAYWRIGHT_OPENSWE_URL set explicitly for the same reason as in
        # e2e-mocked — chromium-sandbox is one of the three open-swe projects.
        # It is the least forgiving of the three if mispointed: the example
        # app serves no /api/open-swe/sandbox/* routes at all.
        run: pnpm e2e --project=chromium-sandbox
        env:
          CI: 'true'
          PLAYWRIGHT_OPENSWE_URL: http://localhost:${{ env.OPENSWE_PORT }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-sandbox
          path: playwright-report/
          retention-days: 7

  visual:
    name: E2E — Visual regression
    runs-on: ubuntu-latest
    # SAME ENVIRONMENT AS THE ONE THAT MADE THE BASELINES (#76).
    #
    # visual-baselines.yml generates them on bare `ubuntu-latest` with
    # `pnpm --filter example start`. Playwright resolves snapshots per platform,
    # and text metrics differ with the available font set, so a gate that reads
    # them from anywhere else compares against a rendering nobody agreed to.
    # Measured while wiring this: the same specs inside the
    # mcr.microsoft.com/playwright container fail on SIZE, not pixels —
    # 197x179 expected against 183x179 received, identical heights, narrower
    # widths. That is a font stack, not a regression, and it is exactly the
    # false red this note exists to prevent.
    env:
      EXAMPLE_PORT: 3000
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build packages
        run: pnpm build

      - name: Start example app (production build)
        env:
          PORT: ${{ env.EXAMPLE_PORT }}
        run: |
          pnpm --filter example start &
          timeout 60 bash -c 'until curl -sf http://localhost:'"$PORT"'/ >/dev/null 2>&1; do sleep 2; done'
          echo "example ready on :$PORT (next start)"

      - name: Precheck — the visual project must match tests
        # THE SAME GUARD THE GENERATOR HAS, FOR THE SAME REASON. A project that
        # matches nothing exits 0, so without this the gate would be green while
        # asserting nothing — which is the state #76 describes and this job is
        # meant to end, not reproduce.
        run: |
          # THE VERDICT FIRST, THEN THE COUNT (#216).
          #
          # This was `playwright --list … | grep -c … || true`, which reports
          # grep's status and swallows playwright's. A crashed --list then
          # yields 0 and the error below blames `testMatch` for a failure that
          # never reached it. Capturing the run separately keeps the two
          # diagnoses apart, and NO_COLOR keeps ANSI escapes out of the pattern.
          if ! NO_COLOR=1 pnpm exec playwright test --list --project=visual \
              > /tmp/visual-list.txt 2>&1; then
            echo "::error::playwright --list failed; any count from it would be meaningless"
            tail -20 /tmp/visual-list.txt
            exit 1
          fi
          LISTED="$(grep -cE '^\s+\[visual\]' /tmp/visual-list.txt || true)"
          echo "visual project matches $LISTED test(s)"
          if [ "$LISTED" -lt 1 ]; then
            echo "::error::--project=visual matched 0 tests, so this job would pass while checking nothing."
            exit 1
          fi

      - name: Visual regression
        run: pnpm e2e --project=visual

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 7

  llm-key-configured:
    name: Config — a model API key is configured
    runs-on: ubuntu-latest
    # This job owns ONE subject: whether the repository has ANY model API key
    # configured. That subject TRACKS — the answer is genuinely "no" today and
    # flips the day someone sets the secret. A check may sit red permanently and
    # honestly, so long as its state follows its subject.
    #
    # It exists because `e2e-llm` below is gated on this job. A gated job that
    # does not run is SKIPPED, and GitHub scores a skipped job as NEUTRAL — the
    # workflow goes green. Gating e2e-llm without this companion would make the
    # missing key silent, which is the same false-green defect one layer up.
    #
    # SCOPED TO PUSH-TO-MAIN, NOT UNGATED — and the reason is not convenience.
    # The subject is REPO-LEVEL CONFIGURATION: a property of main, not of any
    # PR's diff. Nothing in any pull request can move it. Reporting it per-PR is
    # the right property in the wrong channel — a repo-level constant filed
    # where every reader is looking at a diff, which is the mirror of the defect
    # this whole arrangement was built to remove. It would also teach
    # contributors to ignore a red they cannot resolve, which is the same harm
    # relocated to a channel with more readers.
    #
    # THE MANDATORY CLAUSE: a check that declines to answer in EVERY channel has
    # lost the information — that is the original defect wearing the fix's
    # clothes. This one still runs, and still reports, where the subject IS
    # observable: push to main.
    #
    # WHEN IS A CONDITION ON A CHECK LEGITIMATE? Not by motive — motives are not
    # checkable and every gate rationalisation claims a good one. By what the
    # condition is a function of, which you can decide by reading it:
    #
    #   if: secrets.X != ''                          -> a function of the ANSWER.
    #                                                   Forbidden: it hides the
    #                                                   verdict it dislikes.
    #   if: head.repo.full_name == github.repository -> a function of whether an
    #                                                   answer is OBTAINABLE AT
    #                                                   ALL. Legitimate: it
    #                                                   describes the
    #                                                   INSTRUMENT'S REACH.
    #
    # The fork clause below is the second kind. On a fork PR the secret is not
    # exposed at all, so this job could not observe its subject and its red
    # would be a constant, not a verdict.
    #
    # It is REDUNDANT TODAY and deliberately kept: `pull_request` is not an event
    # this job runs on, so the clause is vacuously true. It is a CONJUNCT, so it
    # can only ever narrow, never widen — it cannot switch this job on for PRs.
    # It is here so that it GOVERNS THE MOMENT SOMEONE WIDENS THE TRIGGER,
    # rather than being a hole discovered afterwards.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check whether ANY supported model API key is set
        id: check
        # NAMED FOR THE QUESTION, NOT FOR ONE ANSWER TO IT.
        #
        # This asked only about OPENROUTER_API_KEY, and the backend has not
        # preferred OpenRouter for some time: `_common.make_llm()` tries NVIDIA
        # FIRST, then OpenRouter, then Anthropic — and NVIDIA is the provider
        # this project recommends in its own setup text, because it is free.
        #
        # So the repository could be fully configured for real-LLM runs and
        # this job would still report the absence, keeping every push to main
        # red over a key the project does not ask for first. That is the same
        # defect fixed twice in the app itself this cycle: a message naming one
        # provider when three are accepted, sending someone to fix a key they
        # do not need while the one they have goes unmentioned.
        #
        # The subject is unchanged — "can a real-LLM run happen here" — and it
        # still sits honestly red when the answer is no.
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Report WHICH provider answered, never the key. The length is a
          # deliberate stand-in for the value: enough to tell "set" from "set to
          # empty string", and nothing a log reader can use.
          for name in NVIDIA_API_KEY OPENROUTER_API_KEY ANTHROPIC_API_KEY; do
            value="${!name}"
            if [ -n "${value}" ]; then
              echo "configured=true" >> "$GITHUB_OUTPUT"
              echo "provider=${name}" >> "$GITHUB_OUTPUT"
              echo "${name} is configured (length: ${#value})."
              echo "e2e-llm will run and its result will reflect the real LLM code path."
              exit 0
            fi
          done
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::error::No supported model API key is configured for this repository."
          echo "Accepted, in the order the backend tries them:"
          echo "  NVIDIA_API_KEY      (free at build.nvidia.com — the recommended one)"
          echo "  OPENROUTER_API_KEY"
          echo "  ANTHROPIC_API_KEY"
          echo ""
          echo "Consequence: the 'E2E — Real LLM' job cannot run, so the real LLM"
          echo "code path is NOT being tested. That job is gated on this one"
          echo "precisely so its green/red never pretends otherwise."
          echo ""
          echo "This is a repository-secret decision and is not something CI can"
          echo "resolve for itself. Until the secret is set, this check stays red"
          echo "on purpose — that is the absence being reported, not a flake."
          exit 1

  e2e-llm:
    name: E2E — Real LLM (push to main only)
    runs-on: ubuntu-latest
    # ---------------------------------------------------------------------
    # INVARIANT: llm-key-configured's trigger must be a SUPERSET of this job's
    # trigger. Both are push-to-main today, so it holds.
    #
    # IF YOU WIDEN THE `if:` BELOW, WIDEN THE COMPANION'S FIRST.
    #
    # `needs:` skips this job when the companion does not run — and GitHub
    # scores a skipped job as NEUTRAL, i.e. GREEN. So widening this job to any
    # event the companion does not run on makes this job silently skip and the
    # workflow report success: the exact false-green this arrangement was added
    # to prevent, reintroduced through the mechanism that prevents it.
    #
    # This is invisible at precisely the point where someone would break it,
    # which is why it is written here and not only in a doc.
    # ---------------------------------------------------------------------
    needs: llm-key-configured
    # Gated on the key being configured so this job's state can TRACK ITS
    # SUBJECT — the real LLM code path. Before this gate it ran without a key,
    # died at a precheck, and was red on every run regardless of that code path:
    # a constant, not a verdict. Nothing anyone did to the LLM path could move
    # it, so it could not have detected a breakage.
    #
    # Skipping here is only safe because `llm-key-configured` above is ungated
    # and fails loudly. A skipped job scores NEUTRAL; the absence is reported by
    # that job, never by this one's absence. Do not remove the companion, and do
    # not add `continue-on-error` here — either one restores the false green.
    #
    # The `needs` alone would gate this (a failed dependency skips it). The
    # explicit outputs check is deliberate belt-and-braces: if someone later
    # makes the companion non-failing, this still gates correctly.
    if: >-
      needs.llm-key-configured.outputs.configured == 'true'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    steps:
      - name: Precheck — the key actually reached this job
        # FIRST STEP ON PURPOSE. This used to be the tenth, after checkout,
        # pnpm, Node, install, Playwright browsers, build, `docker compose up`
        # for Django+Postgres+Redis, a 120s health wait, and starting Next.js.
        # Ten runs paid for that entire stack to come up before failing on a
        # condition evaluable in the first second. It now costs seconds.
        #
        # WHAT THIS GUARDS, precisely: that the secret reached THIS JOB's env.
        # That is a different subject from `llm-key-configured` above, which
        # asks whether the repository has the secret at all. This one fails if
        # the `env:` mapping on the test step is dropped or misspelled — a real
        # and separate way for this job to run against no key.
        #
        # CORRECTION — the previous comment here said the spec `test.skip()`s
        # every test when the key is missing and would "silently report green".
        # That is STALE and people have reasoned from it and been wrong.
        # `e2e/shared/llm.spec.ts` THROWS when `CI === "true"`; it only skips in
        # local dev. So this step and that guard are REDUNDANT, not layered, and
        # the spec-level false-green they describe is already closed.
        #
        # The hazard that does exist is one layer up: a gated job that does not
        # run is SKIPPED, and GitHub scores skipped as NEUTRAL — green. That is
        # why `llm-key-configured` is ungated and mandatory, not why this step
        # is here.
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Mirrors the gate above: whichever provider satisfied it must be the
          # one that reaches this job. Asserting on OPENROUTER alone would fail
          # a correctly-configured NVIDIA repository right after the gate passed
          # it — a contradiction between two steps in the same workflow.
          for name in NVIDIA_API_KEY OPENROUTER_API_KEY ANTHROPIC_API_KEY; do
            value="${!name}"
            if [ -n "${value}" ]; then
              echo "${name} present (length: ${#value})"
              exit 0
            fi
          done
          echo "::error::No model API key reached this job's environment, even though llm-key-configured passed. Check the env: mapping on this job's steps."
          exit 1

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build packages
        run: pnpm build

      - name: Start Django backend (compose — backend + db + redis only)
        working-directory: apps/django-backend
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: docker compose up -d

      - name: Wait for Django backend to be healthy
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8002/health/; do sleep 3; done'
          echo "Django backend ready on :8002"

      - name: Start example Next.js app (host, points at Django)
        env:
          BACKEND_URL: http://localhost:8002/api/chat/stream/
          PORT: 3001
        run: |
          pnpm --filter example start &
          timeout 30 bash -c 'until curl -sf http://localhost:3001/; do sleep 2; done'
          echo "Next.js frontend ready on :3001"

      - name: Run real LLM E2E tests
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLAYWRIGHT_BASE_URL: http://localhost:3001
        run: pnpm e2e --project=chromium-llm

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-llm
          path: playwright-report/
          retention-days: 7

      - name: Stop Django compose stack
        if: always()
        working-directory: apps/django-backend
        run: docker compose down -v
