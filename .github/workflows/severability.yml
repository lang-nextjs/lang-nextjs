name: Severability

# `pnpm eject <rung>` must leave a COHERENT, WORKING repo — the milestone's core constraint.
#
# THE CLOSE CONDITION IS NOT "eject runs green".
# eject's exit code reports whether the SCRIPT ran. It says nothing about the tree it produced,
# and that has already been proven satisfiable over a live defect. So each job ejects and then
# holds the RESULT to the standard a hand-written repo would meet: it installs from its own
# lockfile, builds, typechecks, and runs a non-empty test suite; and on the Python side the real
# server boots, serves exactly the retained rungs, and 404s the dropped ones.
#
# EIGHT JOBS, NOT FIVE. Neither Python backend has a package.json, so despite the `apps/*`
# workspace glob pnpm cannot see them — both are absent from the lockfile while all four TS apps
# are present. eject EDITS that plane and a pnpm-only job would never execute a line of it. Five
# green ticks over a plane nothing ran is the same shape as a grep over a missing file.
#
# The matrix is DERIVED from each rung's `languages` in rungs.json. Add a Python implementation
# for open-swe and a ninth job appears on its own, instead of that plane going quietly
# unverified.

on:
  # NO `branches:` FILTER HERE, DELIBERATELY.
  #
  # `pull_request.branches` filters on the BASE branch. While this read
  # `[main, feat/ai-backend-matrix]`, a pull request based on anything else
  # matched no trigger and ran NOTHING — and a PR page with no checks section
  # reads as fine to anyone scrolling past. Not a red we ignored, and not a
  # green over nothing: no checks at all.
  #
  # That is how #130 was merged with ZERO CI, gated on a named check that did
  # not exist. Every stacked PR had the same hole, which is most of them —
  # this team works in stacks routinely.
  #
  # An allowlist of base branches cannot survive that pattern: it needs editing
  # in six files every time someone opens a stack, and it is stale the moment
  # they do. So the filter is gone rather than widened. `push` keeps its filter;
  # that one is about which branches deserve a build, not about which pull
  # requests deserve review.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: severability-${{ github.ref }}
  # CANCEL ON BRANCHES, NEVER ON MAIN (#115). Superseding a PR's in-flight run
  # is right: the newer commit is the one anyone cares about, and the old run's
  # verdict is about code nobody will merge.
  #
  # ON MAIN IT INVERTS THE MEANING OF THE BOARD. A cancelled run reports NO
  # VERDICT — not a weak pass, not a partial one, the absence of a measurement —
  # and nothing in how the board is read distinguishes "passed" from "never
  # finished". With this set to true, 47% of main's runs were cancelled, so main
  # was measured half as often as it appeared to be, and a real failure sat
  # unnoticed among grey icons. Activity suppressed verification, which is
  # exactly backwards: the busier main got, the less it was actually checked.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guards:
    name: eject's own guards are trustworthy
    runs-on: ubuntu-latest
    # WHY THIS JOB EXISTS AT ALL, GIVEN ci.yml ALREADY RUNS test:eject (#180).
    #
    # It ran there and only there, so the workflow literally named "Severability" could be
    # GREEN on a commit where `pnpm test:eject` was RED. That is the column a reader checks
    # when they want to know whether a rung is still severable, and it meant something
    # narrower than its name — the narrowest possible version of this repo's recurring
    # defect, in the gate that exists to catch that defect everywhere else.
    #
    # The matrix below proves ejecting WORKS on this tree. This job proves eject's REFUSALS
    # work. They are different properties and only the second can go stale unnoticed: the
    # refusal paths fire only on input a healthy repo never produces, so nothing else would
    # notice if one quietly stopped working. A green matrix over an eject that has forgotten
    # how to refuse is exactly the shape the matrix cannot see.
    #
    # Deliberately duplicated with ci.yml rather than moved. This costs ~1 min of a node-only
    # job; removing it from CI would mean a red here and a green there for the same defect,
    # and the fix for "two columns disagree" is never "delete one of them".
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Self-test eject's guards
        # Both directions asserted: refusing everything is as useless as refusing nothing.
        run: pnpm test:eject
      - name: Self-test the census (a stale tree must be distinguishable from a broken harness)
        run: pnpm test:census

      - name: Self-test the census-freshness gate (proves it can fail — do not remove)
        run: pnpm test:census-fresh

      - name: Will this branch's census still be true AFTER it merges? (#145)
        # THE CASE GIT CANNOT SEE. Two PRs that write DIFFERENT ownedFileCounts
        # conflict on the same line and GitHub reports CONFLICTING — that half
        # needs no help. Two PRs that write the SAME value merge CLEANLY:
        #
        #     base 128   ours 129   theirs 129   ->  identical change, no conflict
        #
        # and the merged file says 129 over a tree of 130. That is #145's
        # original arithmetic, and it is what two PRs each adding ONE file always
        # produce. Both branches are internally correct, so neither one's CI can
        # see it; the failure lands on whoever pushes next.
        #
        # Computed, never predicted: `git merge-tree --write-tree` produces the
        # real merged tree and the REAL classifier runs over it.
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # DEEPEN FIRST. actions/checkout clones SHALLOW, so origin/main and
          # HEAD share no ancestor locally and `git merge-tree` refuses with
          # "unrelated histories" — a merge-base question cannot be answered
          # from two truncated histories. Fetching the base at --depth=200 is
          # not enough: it deepens one side.
          if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
            git fetch --no-tags --unshallow origin || git fetch --no-tags --deepen=500 origin
          fi
          git fetch --no-tags origin "$BASE_REF"
          pnpm census:fresh --base "origin/$BASE_REF" --head HEAD
        env:
          BASE_REF: ${{ github.base_ref }}
      - name: Self-test freeze:all (the sanctioned exit must not become a silent override)
        run: pnpm test:freeze-all
      - name: Self-test the rung guard (a failure must be distinguishable from "absent")
        # has-rung.mjs decides whether guarded references are exempt from eject's coherence
        # check, so its correctness is upstream of every exemption this workflow relies on.
        run: pnpm test:has-rung

  matrix:
    name: Derive matrix from rungs.json
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - id: gen
        # matrix.mjs exits non-zero if it would emit zero jobs, or an arity the manifest does
        # not imply. A matrix that silently emits nothing is a green board over no verification.
        run: node scripts/matrix.mjs --github >> "$GITHUB_OUTPUT"
      - name: Show the matrix
        run: node scripts/matrix.mjs

  eject:
    needs: matrix
    name: eject ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install (pre-eject)
        run: pnpm install --frozen-lockfile

      - name: Count tests BEFORE eject
        # Captured so the post-eject floor is measured against reality rather than a guess.
        id: before
        run: echo "count=$(git ls-files '*.test.ts' '*.test.tsx' | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Self-test the severance-absence checker (proves it can fail — do not remove)
        # RUNS IN THIS WORKFLOW, AND IN THIS JOB, BECAUSE A PROOF ELSEWHERE PROVES NOTHING HERE.
        #
        # This first lived in ci.yml, reasoning that it drives synthetic forks and needs no
        # eject so it could run anywhere. assert-checker-proof-pairing rejected that, correctly:
        # WORKFLOWS FIRE INDEPENDENTLY, so severability.yml can go green on a run where ci.yml
        # never executed, and on that run nothing has demonstrated the checker can fail. "Does
        # not fit checks.json's proof+checker pairing" is true of this checker — it takes
        # arguments and needs a two-phase eject cycle — but it does not license the proof to
        # live in another workflow.
        #
        # In the same JOB rather than merely the same workflow, so the proof cannot be skipped
        # on a run where the checker is relied on. It costs ~1s per cell.
        run: node scripts/assert-severance-removes-rungs.selftest.mjs

      - name: Record what each rung owns, BEFORE eject
        # THE SUBJECT HAS TO BE CAPTURED WHILE IT STILL EXISTS (#481). After the eject the
        # manifest no longer declares the removed rungs and their files are gone from the
        # index, so nothing in the fork can say what rung 5 used to own. A check that derived
        # the subject from the post-eject tree would be asking the fork to describe what it no
        # longer contains.
        #
        # WRITTEN OUTSIDE THE WORKSPACE ON PURPOSE: eject refuses to run against a dirty tree,
        # and an untracked file in the repo is exactly that. Measured — the first version of
        # this wrote ./rec.json and eject refused with "Commit or stash your changes".
        run: node scripts/assert-severance-removes-rungs.mjs --record "$RUNNER_TEMP/owned.json"

      - name: pnpm eject ${{ matrix.rung }}
        # eject refuses to run against a stale census, verifies the deletion count EXACTLY
        # against the frozen ownedFileCount, and fails on any dangling import or config
        # reference to a deleted app. None of that proves the fork WORKS — that is below.
        #
        # Matrix values reach `run:` through env, never string-interpolated into the script.
        # They come from rungs.json (repo-controlled, and the schema pins ids to ^[a-z0-9-]+$),
        # so this is defence in depth rather than a live hole — but the habit is the protection.
        env:
          RUNG: ${{ matrix.rung }}
        run: node scripts/eject.mjs "$RUNG"

      - name: CHECK-2 — severance is exact and non-vacuous
        env:
          BEFORE: ${{ steps.before.outputs.count }}
          RETAINED: ${{ matrix.retained }}
        run: |
          set -euo pipefail
          AFTER=$(git ls-files '*.test.ts' '*.test.tsx' | wc -l | tr -d ' ')
          echo "test files: $BEFORE -> $AFTER"
          # Classification must still be total and disjoint IN THE FORK — the fork is an input
          # to this same tooling, not an artifact.
          node scripts/validate-manifest.mjs
          node scripts/classify.mjs
          # The retained set must be exactly what the manifest says, no more and no less.
          #
          # shellcheck disable=SC2016
          # SC2016 flags `${got}` / `${want}` below as unexpanded. They are JS TEMPLATE
          # LITERALS and must NOT be expanded by the shell — the single quotes are correct,
          # and load-bearing twice over: they are also why RETAINED is read through
          # process.env rather than interpolated into the script, which is the habit that
          # keeps matrix values out of the code they parameterise.
          node -e '
            const m = require("./rungs.json");
            const want = process.env.RETAINED.split(",");
            const got = m.rungs.map(r => r.id);
            const eq = want.length === got.length && want.every((x,i) => x === got[i]);
            if (!eq) { console.error(`FAIL: fork declares [${got}], expected [${want}]`); process.exit(1); }
            console.log(`PASS: fork declares exactly [${got}]`);
          '
          # THE ASSERTION THAT WAS MISSING (#481). Everything above is satisfied by severing
          # NOTHING: no guard here requires AFTER < BEFORE, and `eject
          # 5-software-developer-agent` retains all five rungs, removes zero files, and passes
          # a step called "severance is exact and non-vacuous". The identity case satisfies a
          # rule written for the asymmetric one.
          #
          # This asserts the property where it is claimed and PRINTS IT — `248 -> 0` rather
          # than a green tick — and for the topmost fork, which removes nothing, it says so
          # instead of passing quietly. Until now the property held only as a side effect of
          # classify.mjs still being total and disjoint on the fork: a real guarantee, stated
          # nowhere.
          node scripts/assert-severance-removes-rungs.mjs \
            --verify "$RUNNER_TEMP/owned.json" --retained "$RETAINED"
      - name: TS plane — the fork must build, typecheck and test
        if: matrix.lang == 'ts'
        env:
          BEFORE: ${{ steps.before.outputs.count }}
        run: |
          set -euo pipefail
          # --frozen-lockfile is the point: it proves eject regenerated the LOCKFILE, not just
          # deleted files. Plain `pnpm install` would paper over exactly that.
          pnpm install --frozen-lockfile
          pnpm build
          pnpm typecheck
          pnpm test
          # A repo with no tests passes `pnpm test`. Assert the suite is non-empty, and that
          # eject did not quietly take most of it: a fork that dropped 90% of its coverage is
          # not a working repo, it is a green one.
          AFTER=$(git ls-files '*.test.ts' '*.test.tsx' | wc -l | tr -d ' ')
          if [ "$AFTER" -lt 1 ]; then echo "FAIL: fork has zero test files"; exit 1; fi
          MIN=$(( BEFORE / 2 ))
          if [ "$AFTER" -lt "$MIN" ]; then
            echo "FAIL: fork kept only $AFTER of $BEFORE test files (< half) — over-deletion?"
            exit 1
          fi
          echo "PASS: fork builds, typechecks, and runs $AFTER test files"

      - name: TS plane — the fork declares only parts it can speak
        if: matrix.lang == 'ts'
        # THE POINT IS THAT THIS RUNS ON THE FORK, NOT ON MAIN. ci.yml already runs it on the
        # monorepo; until #89 it could not run here, because eject pruned barrels, playwright
        # projects and python registries but NOT the protocol declarations — a rung-1 fork
        # declared 11 data-* parts and could produce 3. That was a real gap and skipping the
        # cell was the honest response to it; running it now is what makes the fork's green
        # mean something rather than mean "exempted".
        #
        # It is a distinct property from `pnpm test` above. A fork that declares a part whose
        # producer AND renderer were both ejected still builds, still typechecks, and every
        # test still passes — the declaration is just a key in a Record<string, ZodTypeAny>.
        # Only a triangulation across declaration, producer and consumer sees it.
        run: pnpm payloads

      - name: Python plane — the fork has no undefined names (the TS plane's `tsc`, for py)
        if: matrix.lang == 'py'
        # THE ASYMMETRY THIS CLOSES (#80). The TS plane runs `pnpm typecheck`
        # post-eject, and that step is why it is trustworthy. There was no
        # Python counterpart in any workflow — zero matches for mypy, pyright,
        # ruff, flake8 or pylint across all nine.
        #
        # It matters here specifically because eject EDITS Python by regex: it
        # prunes an import and `_MODULES`, and cannot see a call site. The
        # result is a fork naming a module it just removed. In TypeScript `tsc`
        # catches that class outright; in Python it surfaced only at runtime,
        # inside a startup hook, where the sole symptom was "the server never
        # came up" — 36 red runs.
        #
        # The boot check below is NOT a substitute. It executes only the import
        # and startup paths, so it is blind to a dead reference in any handler
        # nothing calls at boot. Measured on main while wiring this up: ruff
        # found 3 undefined names in `list_tools` after `eject langchain` and 3
        # after `eject langgraph`, none of which the boot check could see —
        # the same defect #79 fixed in `lifespan`, surviving one function down.
        #
        # F821 only. This is a correctness gate, not a style one; a fork should
        # never go red here over formatting.
        run: |
          set -euo pipefail
          pipx run ruff check --select F821 --no-cache \
            apps/fastapi-backend apps/django-backend

      - name: Self-test the health probe (proves it can fail — do not remove)
        if: matrix.lang == 'py'
        run: bash .github/scripts/await-http-json.selftest.sh

      - name: Python plane — the real server boots and serves exactly the retained rungs
        if: matrix.lang == 'py'
        env:
          RUNTIMES: ${{ matrix.runtimes }}
          RETAINED: ${{ matrix.retained }}
        run: |
          set -euo pipefail
          # pnpm cannot see either backend, so this is the ONLY place eject's Python edits are
          # executed rather than merely written.
          #
          # THE TWO RUNTIMES HAVE OPPOSITE URL CONVENTIONS, and this step used to hardcode
          # FastAPI's for both, so the Django half could never have passed:
          #
          #                    health          unknown rung (POST)
          #   Django    /health/  = 200      /api/chat/stream/x/ = 404
          #             /health   = 301  <-- /api/chat/stream/x  = 500  <-- what this used to send
          #   FastAPI   /health   = 200      /api/chat/stream/x  = 404
          #             /health/  = 307      /api/chat/stream/x/ = 307
          #
          # Django's APPEND_SLASH redirects the slashless form; on a POST with a body it cannot
          # redirect at all and raises, which is the 500. So the PATHS are per-runtime exactly
          # as PORT already was. Measured against both containers, not read off the compose file.
          for RT in ${RUNTIMES//,/ }; do
            echo "=== $RT ==="
            if [ "$RT" = "django" ]; then
              DIR=apps/django-backend; PORT=8002; HEALTH_PATH=/health/; SLASH=/
            else
              DIR=apps/fastapi-backend; PORT=8001; HEALTH_PATH=/health; SLASH=
            fi
            # --build is not optional. Without it compose reuses any image already
            # tagged for this project, so the run can assert against a container
            # built from PRE-eject source. A fresh CI runner has no cache and would
            # build anyway, but relying on that makes local reproduction silently
            # differ from CI — which is exactly how this nearly got misdiagnosed as
            # "eject broke fastapi" when the image was three months old.
            docker compose -f "$DIR/docker-compose.yml" up -d --wait --build 2>&1 | tail -5

            # Replaces a 60-iteration loop that had NO failure branch and accepted any 2xx OR
            # 3xx as "up". A health check that cannot tell "server never came up" from "server
            # said nothing" is a check with no subject. This one fails loudly, naming the URL,
            # the elapsed time, the attempt count, the HTTP status and the last body.
            HEALTH="$(bash .github/scripts/await-http-json.sh "http://localhost:$PORT$HEALTH_PATH" ai_backends 120)"
            echo "$HEALTH"

            python3 -c '
          import json, os, sys
          got = sorted(json.loads(sys.argv[1])["ai_backends"])
          want = sorted(os.environ["RETAINED"].split(","))
          if got != want:
              print(f"FAIL: /health serves {got}, fork retains {want}")
              sys.exit(1)
          print(f"PASS: /health serves exactly {got}")
          ' "$HEALTH"

            # POSITIVE CONTROL, and it is not optional. The negative assertion below is that a
            # dropped rung 404s — but if the URL shape were simply wrong, EVERY rung would 404
            # and that assertion would pass while proving nothing. So first prove a RETAINED
            # rung does NOT 404 at this exact path shape. Only then do the 404s mean anything.
            for RUNG in ${RETAINED//,/ }; do
              # `|| true`: a RETAINED rung streams, so curl exits 18 (partial transfer)
              # when the body is discarded. Only the status matters here. The 000/empty
              # guard below keeps that tolerance from swallowing an unreachable server.
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST \
                "http://localhost:$PORT/api/chat/stream/$RUNG$SLASH" \
                -H 'content-type: application/json' -d '{}' || true)
              if [ -z "$CODE" ] || [ "$CODE" = "000" ]; then
                echo "FAIL: no HTTP response for retained rung '$RUNG' — server unreachable"
                exit 1
              fi
              if [ "$CODE" = "404" ]; then
                echo "FAIL: RETAINED rung '$RUNG' 404s at /api/chat/stream/$RUNG$SLASH."
                echo "      The path shape is wrong for $RT, so the dropped-rung 404 checks"
                echo "      below would pass vacuously. Fix the path, not this assertion."
                exit 1
              fi
              echo "PASS: retained rung '$RUNG' is served ($CODE) — path shape confirmed"
            done

            # Every DROPPED rung must 404. Without this, eject could leave a rung serving and
            # the positive assertion above would still pass.
            for RUNG in langchain langgraph deepagents; do
              case ",$RETAINED," in *",$RUNG,"*) continue;; esac
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST \
                "http://localhost:$PORT/api/chat/stream/$RUNG$SLASH" \
                -H 'content-type: application/json' -d '{}' || true)
              if [ -z "$CODE" ] || [ "$CODE" = "000" ]; then
                echo "FAIL: no HTTP response for dropped rung '$RUNG' — server unreachable"
                exit 1
              fi
              if [ "$CODE" != "404" ]; then
                echo "FAIL: dropped rung '$RUNG' answered $CODE, expected 404"
                exit 1
              fi
              echo "PASS: dropped rung '$RUNG' 404s"
            done
            docker compose -f "$DIR/docker-compose.yml" down -v 2>&1 | tail -2
          done
